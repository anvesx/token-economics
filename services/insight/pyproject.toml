[project]
name = "token-economics-svc-insight"
version = "0.1.0"
description = "Attribution, baseline report and the leak detectors in alert mode."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["token-economics-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_economics_svc_insight"]

[project.entry-points."token_economics.services"]
detectors = "token_economics_svc_insight:open_detectors"
baseline = "token_economics_svc_insight:baseline"
baseline_markdown = "token_economics_svc_insight:baseline_markdown"
coverage_markdown = "token_economics_svc_insight:coverage_markdown"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
