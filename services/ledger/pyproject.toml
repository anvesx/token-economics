[project]
name = "token-economics-svc-ledger"
version = "0.1.0"
description = "Append-only ledger: one row per provider response id."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["token-economics-contracts"]

[project.entry-points."token_economics.services"]
ledger = "token_economics_svc_ledger:open_ledger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_economics_svc_ledger"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
