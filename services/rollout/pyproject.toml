[project]
name = "token-economics-svc-rollout"
version = "0.1.0"
description = "Shadow runs on mirrored traffic with write isolation; later canary, kill-switch and rollback."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["token-economics-contracts", "token-economics-stats"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_economics_svc_rollout"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[project.entry-points."token_economics.services"]
shadow = "token_economics_svc_rollout:open_shadow"
kill = "token_economics_svc_rollout:open_kill"
