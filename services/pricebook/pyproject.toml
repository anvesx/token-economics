[project]
name = "token-economics-svc-pricebook"
version = "0.1.0"
description = "Serves price rows and owns the price store."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["token-economics-contracts", "token-economics-pricebook-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_economics_svc_pricebook"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[project.entry-points."token_economics.services"]
pricebook = "token_economics_svc_pricebook:open_pricebook"
