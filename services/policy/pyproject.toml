[project]
name = "token-economics-svc-policy"
version = "0.1.0"
description = "Runs the feature pipeline in order and applies each feature's flag."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["token-economics-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_economics_svc_policy"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[project.entry-points."token_economics.services"]
policy = "token_economics_svc_policy:open_policy"
