[project]
name = "token-economics-svc-eval"
version = "0.1.0"
description = "Eval harness: preregistered specs, isolated arms, attempts and paired verdicts on cost per successful task."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["token-economics-contracts", "token-economics-stats"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_economics_svc_eval"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[project.entry-points."token_economics.services"]
eval = "token_economics_svc_eval:create"
