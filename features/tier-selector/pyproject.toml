[project]
name = "token-economics-feat-tier-selector"
version = "0.1.0"
description = "Pick the service tier per workload (batch, priority, standard) by rule."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["token-economics-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_economics_feat_tier_selector"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[project.entry-points."token_economics.features"]
tier_selector = "token_economics_feat_tier_selector:create"
