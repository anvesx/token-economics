[project]
name = "token-economics-feat-strong-share"
version = "0.1.0"
description = "Cap each tenant's share of strong-model calls and alert on drift."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["token-economics-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_economics_feat_strong_share"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[project.entry-points."token_economics.features"]
strong_share = "token_economics_feat_strong_share:create"
