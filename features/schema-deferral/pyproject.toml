[project]
name = "token-economics-feat-schema-deferral"
version = "0.1.0"
description = "Defer tool schemas above a threshold, with a server-side tool search recovery path."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["token-economics-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_economics_feat_schema_deferral"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[project.entry-points."token_economics.features"]
schema_deferral = "token_economics_feat_schema_deferral:create"
