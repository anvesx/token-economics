[project]
name = "token-economics-feat-switch-pricer"
version = "0.1.0"
description = "Allow a mid-session model switch only when the saving beats the cache rewrite."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["token-economics-contracts", "token-economics-metering"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_economics_feat_switch_pricer"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[project.entry-points."token_economics.features"]
switch_pricer = "token_economics_feat_switch_pricer:create"
