[project]
name = "token-economics-feat-harness-adapters"
version = "0.2.0"
description = "Connect a harness to the gateway: one file per harness, five functions each."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["token-economics-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_economics_feat_harness_adapters"]

[project.entry-points."token_economics.adapters"]
claude_code = "token_economics_feat_harness_adapters.providers.claude_code:ADAPTER"
sdk = "token_economics_feat_harness_adapters.providers.sdk:ADAPTER"
codex = "token_economics_feat_harness_adapters.providers.codex:ADAPTER"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
