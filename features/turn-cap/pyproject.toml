[project]
name = "token-economics-feat-turn-cap"
version = "0.1.0"
description = "Turn cap per model, set from the baseline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["token-economics-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_economics_feat_turn_cap"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[project.entry-points."token_economics.features"]
turn_cap = "token_economics_feat_turn_cap:create"
