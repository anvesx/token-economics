[project]
name = "token-economics-feat-observation-masking"
version = "0.1.0"
description = "Mask old tool results above a trigger, in steps that keep the cached prefix stable."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["token-economics-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_economics_feat_observation_masking"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[project.entry-points."token_economics.features"]
observation_masking = "token_economics_feat_observation_masking:create"
