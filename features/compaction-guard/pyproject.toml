[project]
name = "token-economics-feat-compaction-guard"
version = "0.1.0"
description = "Count compactions per session and recommend a restart at the third."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["token-economics-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_economics_feat_compaction_guard"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[project.entry-points."token_economics.features"]
compaction_guard = "token_economics_feat_compaction_guard:create"
