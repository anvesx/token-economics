[project]
name = "token-economics-feat-output-cap"
version = "0.1.0"
description = "Cap oversized tool results before they are sent, never cutting tracebacks or edit anchors."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["token-economics-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_economics_feat_output_cap"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[project.entry-points."token_economics.features"]
output_cap = "token_economics_feat_output_cap:create"
