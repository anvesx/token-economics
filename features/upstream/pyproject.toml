[project]
name = "token-economics-feat-upstream"
version = "0.1.0"
description = "Send the request upstream unchanged: one file per provider."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["token-economics-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_economics_feat_upstream"]

[project.entry-points."token_economics.upstreams"]
anthropic = "token_economics_feat_upstream.providers.anthropic:UPSTREAM"
openai = "token_economics_feat_upstream.providers.openai:UPSTREAM"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
