[project]
name = "token-economics-feat-sticky-model"
version = "0.1.0"
description = "One model per session: flag or undo a mid-session model change."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["token-economics-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_economics_feat_sticky_model"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[project.entry-points."token_economics.features"]
sticky_model = "token_economics_feat_sticky_model:create"
