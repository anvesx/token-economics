[project]
name = "token-economics-feat-budgets"
version = "0.1.0"
description = "Virtual-key budgets: reserve then true-up, alerts at 75, 90 and 100 percent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["token-economics-contracts", "token-economics-metering"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_economics_feat_budgets"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
