[project]
name = "token-economics-feat-max-tokens"
version = "0.1.0"
description = "Hard cap on max_tokens per model."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["token-economics-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_economics_feat_max_tokens"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[project.entry-points."token_economics.features"]
max_tokens = "token_economics_feat_max_tokens:create"
