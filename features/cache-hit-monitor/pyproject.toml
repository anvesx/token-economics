[project]
name = "token-economics-feat-cache-hit-monitor"
version = "0.1.0"
description = "Cache hit rate and miss events per caller."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["token-economics-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_economics_feat_cache_hit_monitor"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[project.entry-points."token_economics.features"]
cache_hit_monitor = "token_economics_feat_cache_hit_monitor:create"
