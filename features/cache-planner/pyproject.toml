[project]
name = "token-economics-feat-cache-planner"
version = "0.1.0"
description = "Pick the 5-minute or 1-hour cache TTL from the observed reuse gap."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["token-economics-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_economics_feat_cache_planner"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[project.entry-points."token_economics.features"]
cache_planner = "token_economics_feat_cache_planner:create"
