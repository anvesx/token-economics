[project]
name = "token-economics-feat-context-clearing"
version = "0.1.0"
description = "Ask the provider to clear old tool uses server-side (context management)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["token-economics-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_economics_feat_context_clearing"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[project.entry-points."token_economics.features"]
context_clearing = "token_economics_feat_context_clearing:create"
