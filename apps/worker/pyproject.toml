[project]
name = "token-economics-app-worker"
version = "0.1.0"
description = "Scheduled jobs: auto-rollback checks, retention and backups."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["token-economics-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_economics_app_worker"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[project.scripts]
token-economics-worker = "token_economics_app_worker.__main__:main"
