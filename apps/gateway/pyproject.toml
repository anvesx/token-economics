[project]
name = "token-economics-app-gateway"
version = "0.1.0"
description = "The request path: pass-through proxy, key resolve, stream tee, fail-open observation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["token-economics-contracts", "starlette>=0.40", "uvicorn>=0.30", "httpx>=0.27", "brotli>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_economics_app_gateway"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[project.optional-dependencies]
# The gateway finds these at runtime through entry points; it never imports them.
all = ["token-economics-metering", "token-economics-svc-ledger", "token-economics-svc-pricebook",
       "token-economics-feat-upstream", "token-economics-feat-harness-adapters", "token-economics-svc-policy",
       "token-economics-svc-tenancy", "token-economics-svc-health", "token-economics-feat-budgets",
       "token-economics-feat-turn-cap", "token-economics-feat-loop-guard"]

[project.scripts]
token-economics-gateway = "token_economics_app_gateway.__main__:main"
