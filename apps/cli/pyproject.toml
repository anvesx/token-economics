[project]
name = "token-economics-app-cli"
version = "0.1.0"
description = "token-economics CLI: init, replay, report, detect."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["token-economics-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_economics_app_cli"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[project.optional-dependencies]
# The CLI finds these at runtime through entry points; it never imports them.
all = ["token-economics-metering", "token-economics-svc-ledger", "token-economics-svc-pricebook",
       "token-economics-svc-insight", "token-economics-feat-harness-adapters", "token-economics-svc-tenancy",
       "token-economics-feat-budgets"]

[project.scripts]
token-economics = "token_economics_app_cli.main:main"
