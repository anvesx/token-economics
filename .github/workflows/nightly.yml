name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # NOT IMPLEMENTED YET. This is a placeholder for the P0 exit gate item "reconcile against the vendor invoice".
  # It needs provider admin keys (stored as repository secrets) and a `reconcile` command in apps/cli.
  # Until then the command fails, so the nightly run stays visibly red instead of looking like a pass.
  reconcile-vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: token-economics reconcile (not implemented yet)
        run: uv run token-economics reconcile
