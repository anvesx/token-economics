name: Gate
description: "A phase exit check. Passes or fails on evidence."
title: "gate: "
labels: ["type:gate"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What and why
      description: Two or three plain sentences.
    validations:
      required: true
  - type: input
    id: done_when
    attributes:
      label: Done when
      description: One line a second person can check. Name the observable result, not the work.
      placeholder: "A replayed Claude Code session reproduces the vendor invoice within 0.1 percent"
    validations:
      required: true
  - type: input
    id: test_name
    attributes:
      label: Test name
      description: The test that goes red first and turns green when this is done (path::name).
      placeholder: "services/ledger/tests/unit/test_append.py::test_rows_are_append_only"
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size (days)
      options:
        - "0.5"
        - "1"
        - "2"
    validations:
      required: true
  - type: input
    id: dependency
    attributes:
      label: Dependency
      description: The issue this waits for, or "none".
      placeholder: "#12 or none"
    validations:
      required: true
