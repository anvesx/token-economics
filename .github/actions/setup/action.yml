name: Set up the workspace
description: Install uv, the Python version from .python-version, and the whole workspace from the lockfile.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Install Python from .python-version
      shell: bash
      run: uv python install
    - name: Sync the workspace
      shell: bash
      run: uv sync --all-packages --frozen
