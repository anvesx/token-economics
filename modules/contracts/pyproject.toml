[project]
name = "token-economics-contracts"
version = "0.1.0"
description = "Token buckets, ledger row, price row, capability flags and the ports every package meets through. No I/O."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_economics_contracts"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
