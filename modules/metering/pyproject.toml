[project]
name = "token-economics-metering"
version = "0.1.0"
description = "Five-bucket usage normaliser, dedupe guard and the ordered cost formula."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["token-economics-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_economics_metering"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[project.entry-points."token_economics.normalisers"]
anthropic = "token_economics_metering.providers.anthropic:NORMALISER"
openai = "token_economics_metering.providers.openai:NORMALISER"

[project.entry-points."token_economics.services"]
cost = "token_economics_metering:open_cost_calculator"
dedupe = "token_economics_metering:open_dedupe"
