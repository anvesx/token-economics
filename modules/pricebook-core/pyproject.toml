[project]
name = "token-economics-pricebook-core"
version = "0.1.0"
description = "Append-only price rows, lookup by request date and context band, 30-day staleness flag."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["token-economics-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_economics_pricebook_core"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
