<body>
<div id="tip"></div>
<header><div class="crumbs" id="crumbs"></div><div class="crumbs" style="margin-top:2px"><a href="st-eng-solution-lld-l8.html">Full single-page diagram →</a></div><h1 id="title"></h1></header>
<main id="main"></main>
<script>
const D = __DATA__;
const NW=170, NH=64, CP=420, RP=210, M=150, T=70;
const S = Object.fromEntries(D.stages.map(s=>[s.id,s]));
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);

function crumbs(parts){
  $('crumbs').innerHTML = parts.map((p,i)=> p.href ? `<a href="${p.href}">${esc(p.t)}</a>` : `<b>${esc(p.t)}</b>`).join(' <span>›</span> ');
}
function chipsFor(stage){
  const count={};
  stage.nodes.filter(n=>!n.ghost).forEach(n=>{const k=D.comps[n.base].kind;count[k]=(count[k]||0)+1});
  return Object.entries(count).map(([k,v])=>{const K=D.kinds[k];return `<span class="chip" style="background:${K.fill};border-color:${K.stroke}">${v} ${esc(K.name)}</span>`}).join('');
}

/* ---------- Level 1 ---------- */
function overview(){
  crumbs([{t:'Overview'}]);
  $('title').innerHTML = '<span class="lvl">Level 1</span>One signal, from arrival to decision';
  const main = D.stages.filter(s=>s.role==='main'), sup = D.stages.filter(s=>s.role==='support');
  const card = s => `<div class="scard ${s.role==='support'?'sup':''}" data-go="#/s/${s.id}"><span class="num">${esc(s.n)}</span><h3>${esc(s.title)}</h3><p>${esc(s.blurb)}</p><div class="chips">${chipsFor(s)}</div><div class="go">Open stage (${s.groups.length} groups, ${s.nodes.filter(n=>!n.ghost).length} components) →</div></div>`;
  $('main').innerHTML = `<p class="sub">Read-only and federated: models extract and explain, numbers come only from calculators and the simulator, and buyers execute in SAP. Pick a stage to go one level down.</p>
  <div class="flow">${main.map(card).join('<span class="arrow">→</span>')}</div>
  <h2>Supporting stages, used by the flow above</h2>
  <div class="flow">${sup.map(card).join('')}</div>
  <h2>Cross-cutting design</h2>
  <div class="flow">${(D.xc||[]).map(x=>`<div class="scard sup" data-go="#/x/${x.id}"><h3>${esc(x.title)}</h3><p>${esc(x.blurb)}</p><div class="go">Open →</div></div>`).join('')}<div class="scard sup" data-go="#/x/refs"><h3>Research and references</h3><p>${D.refs.length} papers, docs and repositories behind the algorithms.</p><div class="go">Open →</div></div></div>
  <p class="hint">Level 2 shows one stage as a few groups. Level 3 shows one group with its components and the arrows between them. Level 4 is a spec card for one component. Total: ${Object.keys(D.comps).length} components.</p>`;
  document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>location.hash=e.dataset.go);
}

/* ---------- Level 2 ---------- */
function wrap(text,max){
  const words=text.split(/\s+/), lines=[]; let cur='';
  words.forEach(w=>{ if((cur+' '+w).trim().length>max){ if(cur) lines.push(cur); cur=w } else cur=(cur+' '+w).trim() });
  if(cur) lines.push(cur); return lines;
}
function clip(s,n){return s.length>n?s.slice(0,n-1)+'…':s}

function graphView(st,head){
  crumbs(head.crumbs);
  $('title').innerHTML = head.title;
  const byId=Object.fromEntries(st.nodes.map(n=>[n.id,n]));
  /* Level 3: a gap between columns grows by 30px for every line beyond 5 that crosses it */
  const mc0=Math.max(...st.nodes.map(n=>n.c)), colX=[M]; 
  for(let c=0;c<mc0;c++){let x=0; if(st.route) st.edges.forEach(e=>{const A=byId[e.a],B=byId[e.b]; if(A&&B&&Math.min(A.c,B.c)<=c&&Math.max(A.c,B.c)>c) x++}); colX.push(colX[c]+CP+(st.route?Math.max(0,x-5)*30:0))}
  const cxOf=c=>colX[Math.floor(c)]+(c-Math.floor(c))*CP;
  const P = n => ({cx:cxOf(n.c), cy:T+n.r*RP});
  const side=(n,s)=>{const p=P(n);return s==='left'?[p.cx-NW/2,p.cy]:s==='right'?[p.cx+NW/2,p.cy]:s==='top'?[p.cx,p.cy-NH/2]:[p.cx,p.cy+NH/2]};
  const gx=c=>cxOf(c), gy=r=>T+r*RP;
  const maxC=Math.max(...st.nodes.map(n=>n.c)), maxR=Math.max(...st.nodes.map(n=>n.r));
  const W=colX[colX.length-1]+M, H=T+maxR*RP+T+70;
  let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
  <defs>${[['n','#64748b'],['e','#1f4fd8'],['s','#c2410c'],['d','#64748b']].map(([k,c])=>`<marker id="ar-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`).join('')}</defs>`;
  (st.frames||[]).forEach(f=>{
    const x=gx(f.c0)-NW/2-14,y=gy(f.r0)-NH/2-30,w=(f.c1-f.c0)*CP+NW+28,h=(f.r1-f.r0)*RP+NH+44;
    svg+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/><text x="${x+12}" y="${y+18}" font-size="12" font-weight="600" fill="#64748b">${esc(f.title)}</text>`;
  });
  const labels=[], laneUse={}, inUse={};
  /* Level 3 only: grid router. Lines may not enter any box or description block; they bend as little as possible and keep off lanes already lanes */
  const G=5, GW=Math.ceil(W/G)+1, GH=Math.ceil(H/G)+1, blk=new Uint8Array(GW*GH), hocc=new Uint8Array(GW*GH), vocc=new Uint8Array(GW*GH);
  const fill=(x,y,w,h,v)=>{v=v||1;for(let j=Math.floor((y-8)/G);j<=Math.ceil((y+h+8)/G);j++)for(let i=Math.floor((x-8)/G);i<=Math.ceil((x+w+8)/G);i++)if(i>=0&&j>=0&&i<GW&&j<GH&&i*G>x-6&&i*G<x+w+6&&j*G>y-6&&j*G<y+h+6)blk[j*GW+i]=Math.max(blk[j*GW+i],v)};
  if(st.route){st.nodes.forEach(n=>{const p=P(n); fill(p.cx-NW/2,p.cy-NH/2,NW,NH);
    if(!n.ghost){const c=D.comps[n.base]; let rows=0,sn=0; (c.line||'').split('\n').forEach(ln=>{rows+=Math.min(2,wrap(ln,54).length);sn++}); if(rows) fill(p.cx-155,p.cy+NH/2+3,310,rows*11.5+sn*3+4,2)}})}
  const heap=[], push=(k,v)=>{heap.push([k,v]);let i=heap.length-1;while(i>0){const q=(i-1)>>1;if(heap[q][0]<=heap[i][0])break;[heap[q],heap[i]]=[heap[i],heap[q]];i=q}},
    pop=()=>{const t=heap[0],l=heap.pop();if(heap.length){heap[0]=l;let i=0;for(;;){let m=i,a1=2*i+1,b1=a1+1;if(a1<heap.length&&heap[a1][0]<heap[m][0])m=a1;if(b1<heap.length&&heap[b1][0]<heap[m][0])m=b1;if(m===i)break;[heap[m],heap[i]]=[heap[i],heap[m]];i=m}}return t};
  const DX=[1,0,-1,0], DY=[0,1,0,-1], BEND=45, XCOST=8, gArr=new Float32Array(GW*GH*4), prv=new Int32Array(GW*GH*4);
  /* route p0 (heading d0) to p1 so that it arrives heading dEnd. r = how many cells (5px each) another line running the same way must stay away; -1 ignores lines */
  const route1=(p0,d0,p1,dEnd,r)=>{
    const sx=Math.round(p0[0]/G), sy=Math.round(p0[1]/G), tx=Math.round(p1[0]/G), ty=Math.round(p1[1]/G);
    gArr.fill(1e9); const key=(i,j,d)=>(j*GW+i)*4+d; heap.length=0;
    gArr[key(sx,sy,d0)]=0; prv[key(sx,sy,d0)]=-1; push(0,[sx,sy,d0,0]);
    let end=-1;
    while(heap.length){const [,[i,j,d,g]]=pop(); const k=key(i,j,d); if(g>gArr[k]) continue;
      if(i===tx&&j===ty&&d===dEnd){end=k;break}
      for(let nd=0;nd<4;nd++){ if(nd===(d+2)%4) continue;
        const ni=i+DX[nd], nj=j+DY[nd]; if(ni<0||nj<0||ni>=GW||nj>=GH) continue;
        const ci=nj*GW+ni, isT=ni===tx&&nj===ty; if(blk[ci]===1&&!isT) continue;
        let nc=g+1+(nd!==d?BEND:0);
        if(blk[ci]===2){ if(r>=1) continue; nc+=60 }
        if(r>=0){ const horiz=nd%2===0, same=horiz?hocc[ci]:vocc[ci], cross=horiz?vocc[ci]:hocc[ci];
          if(same&&same-1<=r&&!isT) continue; if(cross===1) nc+=XCOST }
        const nk=key(ni,nj,nd); if(nc<gArr[nk]){gArr[nk]=nc;prv[nk]=k;push(nc+Math.abs(ni-tx)+Math.abs(nj-ty),[ni,nj,nd,nc])}}}
    if(end<0) return null;
    const cells=[]; for(let k=end;k>=0;k=prv[k]){const d=k%4, ij=(k-d)/4; cells.push([ij%GW,Math.floor(ij/GW)])}
    cells.reverse();
    const out=[[cells[0][0]*G,cells[0][1]*G]];
    for(let q=1;q<cells.length-1;q++){const a0=cells[q-1],b0=cells[q],c0=cells[q+1]; if((b0[0]-a0[0])!==(c0[0]-b0[0])||(b0[1]-a0[1])!==(c0[1]-b0[1])) out.push([b0[0]*G,b0[1]*G])}
    out.push([cells[cells.length-1][0]*G,cells[cells.length-1][1]*G]); return out};
  const mark=(arr,i,j,v)=>{if(i>=0&&j>=0&&i<GW&&j<GH){const k=j*GW+i; if(!arr[k]||arr[k]>v) arr[k]=v}};
  const commit=pts=>{for(let q=0;q<pts.length-1;q++){const [x0,y0]=pts[q],[x1,y1]=pts[q+1], i0=Math.round(Math.min(x0,x1)/G), i1=Math.round(Math.max(x0,x1)/G), j0=Math.round(Math.min(y0,y1)/G), j1=Math.round(Math.max(y0,y1)/G);
    if(y0===y1){for(let i=i0-4;i<=i1+4;i++)for(let k=-5;k<=5;k++)mark(hocc,i,j0+k,Math.abs(k)+1)}
    else {for(let j=j0-4;j<=j1+4;j++)for(let k=-5;k<=5;k++)mark(vocc,i0+k,j,Math.abs(k)+1)}}};
  const route=(p0,d0,p1,dEnd)=>{let best=null;
    for(const r of [5,3,1,0,-1]){const o=route1(p0,d0,p1,dEnd,r); if(!o) continue;
      if(!best||o.length<=best.length-(r>=3?2:8)) best=o; if(best.length<=4) break}
    if(best) commit(best); return best};
  const snap=v=>Math.round(v/G)*G;
  /* spread the ports: edges that leave or enter the same side of a box get separate heights, 18px apart */
  const portN={}, portI={}, pk=(id,sd)=>id+'|'+sd;
  const sd2=(A,B)=>B.c>A.c?'r':B.c<A.c?'l':'r';
  st.edges.forEach(e=>{const A=byId[e.a],B=byId[e.b]; if(st.route&&!e.via){const sa=sd2(A,B), sb=B.c>A.c?'l':B.c<A.c?'r':'r'; [[e.a,sa],[e.b,sb]].forEach(([id,sd])=>{portN[pk(id,sd)]=(portN[pk(id,sd)]||0)+1}); return} if(e.via||A.r===B.r||A.c===B.c) return; const d=B.c-A.c;
    [[e.a,d>0?'r':'l'],[e.b,d>0?'l':'r']].forEach(([id,sd])=>{portN[pk(id,sd)]=(portN[pk(id,sd)]||0)+1})});
  const portY=(id,sd)=>{const n=portN[pk(id,sd)]||1, i=(portI[pk(id,sd)]=(portI[pk(id,sd)]||0)+1)-1; const st2=n<=3?20:10; return Math.max(-20,Math.min(20,Math.round((i-(n-1)/2)*st2/10)*10))};
  /* Level 3: give every line its own port on the box side (sorted by where the other end is, so lines never cross at the box), stagger how far each stub runs, then route the short lines first */
  const RT={};
  if(st.route){
    /* sides: top is always free, bottom is free only on outside-group boxes (real boxes have their description there) */
    const pick=(A,B)=>{const h=B.c>A.c?'r':B.c<A.c?'l':'r', hb=B.c>A.c?'l':B.c<A.c?'r':'r', dc=B.c===A.c;
      if(B.r===A.r) return [h,hb];
      if(B.r>A.r){ if(dc) return A.ghost&&B.ghost?['b','t']:A.ghost?['b','t']:[ 'r','r']; return [h,B.ghost?hb:'t'] }
      if(dc) return B.ghost?['t','b']:['r','r']; return [A.ghost?h:'t',hb]};
    const ends=[]; st.edges.forEach((e,ei)=>{const A=byId[e.a],B=byId[e.b], [sA,sB]=pick(A,B);
      ends.push({ei,id:e.a,sd:sA,o:B,role:0}); ends.push({ei,id:e.b,sd:sB,o:A,role:1})});
    const grp={}; ends.forEach(x=>{(grp[pk(x.id,x.sd)]=grp[pk(x.id,x.sd)]||[]).push(x)});
    Object.values(grp).forEach(arr=>{
      const tb=arr[0].sd==='t'||arr[0].sd==='b', n=arr.length, me=P(byId[arr[0].id]).cy;
      if(tb) arr.sort((p,q)=>(P(p.o).cx-P(q.o).cx)||(P(p.o).cy-P(q.o).cy)||(p.ei-q.ei));
      else arr.sort((p,q)=>(P(p.o).cy-P(q.o).cy)||(P(p.o).cx-P(q.o).cx)||(p.ei-q.ei));
      const gap=n<=1?0:tb?(n===2?40:n===3?40:25):(n===2?30:n===3?25:Math.max(10,Math.floor(60/(n-1)/5)*5));
      const SL={1:[0],2:[-20,20],3:[-25,0,25],4:[-30,-10,10,30],5:[-30,-15,0,15,30]};

      const e=st.edges[ei], [xa,xb]=by[ei], A=pt(byId[e.a],xa), B=pt(byId[e.b],xb);

  }

    } else if(dr===0){

    } else if(dc===0){

      if(rows) obs.push([p.cx-132,p.cy+NH/2+3,264,rows*11.5+sn*3+4]);}});

/* ---------- Level 2: groups in a stage ---------- */

/* ---------- Level 3: components of one group ---------- */
const GL={};
const ER=s=>s.edges.map(e=>Object.assign({},e,{a:e.ra||e.a,b:e.rb||e.b}));
D.stages.forEach(s=>s.nodes.forEach(n=>{if(n.ghost){const t=D.stages.find(z=>z.id===n.gk[0]);GL[n.id]=t.groups.find(q=>q.id===n.gk[1]).title+' (group)'}}));
function groupView(sid,gid){

  const mem=new Set(g.members), edges=[], seen=new Set(), ghosts=new Set();

    const gk=x=>'g:'+groupOf(x)+'*', na=ia?a:gk(a), nb=ib?b:gk(b); if(!ia) ghosts.add(gk(a)); if(!ib) ghosts.add(gk(b));

    if(v.i.length&&v.o.length){ghostMode[x]='mid'; const nm=new Set([...v.i,...v.o]); ghostCol[x]=nm.size===1?depth[[...nm][0]]+1:depth[x]}
    else if(v.o.length){ghostMode[x]='src'; ghostCol[x]=Math.min(...ins)-1}
    else {ghostMode[x]='dst'; ghostCol[x]=Math.max(...outs)+1}});
  const minC=Math.min(0,...Object.values(ghostCol)), off=-minC;
  const used={}, take=(c,pref)=>{used[c]=used[c]||new Set(); let r=pref; const clash=r=>Object.keys(used).some(k=>Math.abs(k-c)<1&&used[k].has(r)); while(used[c].has(r)||clash(r)) r++; used[c].add(r); return r};
  const nodes=[], rowOf={};
  [...g.members].sort((x,y)=>depth[x]-depth[y]).forEach(m=>{const c=depth[m]+off; const r=take(c,0); rowOf[m]=r; nodes.push({id:m,base:m,c,r})});
  const gnode=(x,c,r)=>{const [gs,gg]=x.slice(2,-1).split('/'); GL[x]=S[gs].groups.find(q=>q.id===gg).title+' (group)'; nodes.push({id:x,gk:[gs,gg],ghost:true,c,r})};
  const mainRows=Math.max(...Object.values(rowOf))+1;
  [...nb.keys()].forEach(x=>{const c=ghostCol[x]+off, v=nb.get(x);

  /* a pair of opposite lines between the same two boxes becomes one two-way line; both texts stay in its hover and list entry */
  for(let i=0;i<edges.length;i++){const e=edges[i]; if(e.bi) continue;
    const j=edges.findIndex((f,k)=>k>i&&!f.bi&&f.a===e.b&&f.b===e.a);
    if(j<0) continue; const f=edges[j];
    e.d=(e.l?e.l+': ':'')+(e.d||'')+'  |  back: '+(f.l?f.l+': ':'')+(f.d||''); e.l=[e.l,f.l].filter(Boolean).join(' / ');
    e.k=e.k==='e'||f.k==='e'?'e':e.k; e.bi=true; edges.splice(j,1)}
  /* several lines between the same two boxes in the same direction become one line; every text stays in its hover and list entry */
  for(let i=0;i<edges.length;i++){const e=edges[i];
    for(let j=edges.length-1;j>i;j--){const f=edges[j]; if(f.a!==e.a||f.b!==e.b||!!f.bi!==!!e.bi) continue;
      e.d=(e.l?e.l+': ':'')+(e.d||'')+'  +  '+(f.l?f.l+': ':'')+(f.d||''); e.l=[e.l,f.l].filter(Boolean).join(' + ');
      e.k=e.k==='e'||f.k==='e'?'e':e.k; edges.splice(j,1)}}
  /* number the lines in reading order: by source column, then target column */
  const colOf=Object.fromEntries(nodes.map(n=>[n.id,n.c])), rw=Object.fromEntries(nodes.map(n=>[n.id,n.r]));
  edges.sort((x,y)=>(colOf[x.a]-colOf[y.a])||(colOf[x.b]-colOf[y.b])||(rw[x.a]-rw[y.a]));
  const ps={n:st.n,title:g.title,blurb:g.line,nodes,edges,frames:[],route:true};
  const gi=st.groups.findIndex(z=>z.id===gid), pg=st.groups[gi-1], ng=st.groups[gi+1];
  graphView(ps,{crumbs:[{t:'Overview',href:'#/'},{t:st.n+'. '+st.title,href:'#/s/'+sid},{t:g.title}],
    title:`<span class="lvl">Level 3</span>${esc(g.title)} <small style="font-weight:400;color:var(--mut)">in ${esc(st.title)}</small>`,
    sub:g.line.replace(/\n/g,' '),
    nav:`<a href="#/s/${sid}">← All groups in ${esc(st.title)}</a>${pg?` &nbsp; <a href="#/g/${sid}/${pg.id}">← ${esc(pg.title)}</a>`:''}${ng?` &nbsp; <a href="#/g/${sid}/${ng.id}">${esc(ng.title)} →</a>`:''}`});
}
function hover(el,html){
  const t=$('tip');
  const mv=ev=>{const w=t.offsetWidth,h=t.offsetHeight;let x=ev.clientX+18,y=ev.clientY+14;if(x+w>innerWidth-8)x=ev.clientX-w-18;if(y+h>innerHeight-8)y=Math.max(8,innerHeight-h-8);t.style.left=Math.max(8,x)+'px';t.style.top=y+'px'};
  el.addEventListener('mouseenter',ev=>{t.innerHTML=html();t.style.display='block';mv(ev)});
  el.addEventListener('mousemove',mv);
  el.addEventListener('mouseleave',()=>{t.style.display='none'});
}

/* ---------- Level 3 ---------- */
function cardView(id){
  const c=D.comps[id]; if(!c){location.hash='#/';return}
  const st=S[c.stage], K=D.kinds[c.kind];
  const grp=st.groups.find(z=>z.id===c.group);
  crumbs([{t:'Overview',href:'#/'},{t:st.n+'. '+st.title,href:'#/s/'+st.id},{t:grp.title,href:'#/g/'+st.id+'/'+grp.id},{t:c.label}]);
  $('title').innerHTML=`<span class="lvl">Level 4</span>${esc(c.label)}`;
  const up=new Map(), down=new Map();
  D.stages.forEach(s=>ER(s).forEach(e=>{
    const a=e.a.replace(/\*$/,''), b=e.b.replace(/\*$/,'');
    if(b===id&&a!==id) up.set(a,(up.get(a)?up.get(a)+', ':'')+(e.l||'link'));
    if(a===id&&b!==id) down.set(b,(down.get(b)?down.get(b)+', ':'')+(e.l||'link'));
    if(e.bi&&b===id&&a!==id) down.set(a,e.l||'link');
  }));
  const list=m=>m.size?[...m].map(([k,l])=>`<a href="#/c/${k}">${esc(D.comps[k].label)}<small>${esc(l)}</small></a>`).join(''):'<p>None in this stage view.</p>';
  const dp=c.deep||null, ul=(a,cls)=>a&&a.length?`<ul class="${cls||''}">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p>None.</p>';
  const R=ids=>(ids||[]).map(i=>D.refs[i]).filter(Boolean);
  let sec='';
  if(dp){
    const al=dp.algorithm||{}, ml=dp.ml, pf=dp.performance||{};
    sec+=`<div class="toc">${[['plain','In plain English'],['contract','Contract'],['purpose','Purpose'],['algo','Algorithm'],dp.math?['math','Maths in full']:null,ml?['ml','The model call']:null,['sec','Security'],['perf','Performance'],['edge','Edge cases'],['tests','Tests'],['cost','Cost'],['fb','Feedback and events'],(dp.papers||[]).length?['res','Research']:null,['refs','References']].filter(Boolean).map(([k,l])=>`<a href="javascript:void(0)" onclick="document.getElementById('sx-${k}').scrollIntoView({behavior:'smooth',block:'start'})">${l}</a>`).join('')}</div>`;
    sec+=`<div class="sec" id="sx-plain"><h3>In plain English</h3><div class="dumbbox">${esc(c.dumb||'')}</div></div>`;
  }
  const contract=`<div class="sec" id="sx-contract" style="padding:0"><table>
  <tr><td>Goes in</td><td>${esc(c.inn)}</td></tr>
  <tr><td>Comes out</td><td>${esc(c.out)}</td></tr>
  <tr><td>Reads / writes</td><td>${esc(c.store)}</td></tr>
  <tr><td>If it fails</td><td>${esc(c.fail)}</td></tr>
  <tr><td>Requirement source</td><td>${esc(c.req)}</td></tr>${c.hard?`<tr><td>Hardening, still open</td><td>${esc(c.hard)}</td></tr>`:''}${c.prop?`<tr><td>Not in client docs</td><td style="background:#fff7ed"><b>DevX proposal:</b> ${esc(c.prop)}</td></tr>`:''}</table></div>`;
  if(dp){
    const al=dp.algorithm||{}, ml=dp.ml, pf=dp.performance||{};
    sec+=contract;
    sec+=`<div class="sec" id="sx-purpose"><h3>What it is for</h3><p>${esc(dp.purpose)}</p><div class="two"><div><h4>Expected</h4>${ul(dp.expected)}</div><div><h4>Not expected</h4>${ul(dp.not_expected,'no')}</div></div></div>`;
    sec+=`<div class="sec" id="sx-algo"><h3>Algorithm and maths</h3><p><b>${esc(al.name||'')}</b></p><div class="formula mono">${esc(al.formula||'')}</div><h4>Steps</h4><ol>${(al.steps||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol><h4>Parameters</h4><table class="t3">${Object.entries(al.params||{}).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</table></div>`;
    if(dp.math){const m=dp.math; sec+=`<div class="sec" id="sx-math"><h3>The maths in full</h3><h4>Symbols</h4>${ul(m.definitions)}<h4>Formula</h4><div class="formula mono">${esc(m.formula_full)}</div><h4>Why it is right</h4><p>${esc(m.derivation)}</p><h4>Worked example</h4><div class="formula mono">${esc(m.worked_example)}</div><h4>Cost of computing it</h4><p>${esc(m.complexity)}</p><h4>How it can go wrong, and the guard</h4>${ul(m.failure_modes)}<h4>How the numbers are chosen and re-tuned</h4><p>${esc(m.calibration)}</p>${(dp.alternatives||[]).length?`<h4>Alternatives rejected</h4><table class="t3">${dp.alternatives.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.why_rejected)}</td></tr>`).join('')}</table>`:''}</div>`}
    if(ml) sec+=`<div class="sec" id="sx-ml"><h3>The model call</h3><table class="t3"><tr><td>Technique</td><td>${esc(ml.technique)}</td></tr><tr><td>Model</td><td>${esc(ml.model)}</td></tr><tr><td>Input</td><td>${esc(ml.input)}</td></tr><tr><td>Output schema</td><td class="mono">${esc(ml.output_schema)}</td></tr><tr><td>Prompt sketch</td><td class="mono">${esc(ml.prompt_sketch)}</td></tr><tr><td>Guardrails</td><td>${ul(ml.guardrails)}</td></tr><tr><td>Cost estimate</td><td>${esc(ml.cost_estimate)}</td></tr></table></div>`;
    sec+=`<div class="sec" id="sx-sec"><h3>Security</h3>${ul(dp.security)}</div>`;
    sec+=`<div class="sec" id="sx-perf"><h3>Performance</h3><table class="t3"><tr><td>Latency and throughput</td><td>${esc(pf.slo)}</td></tr><tr><td>Complexity</td><td>${esc(pf.complexity)}</td></tr><tr><td>At 10x load</td><td>${esc(pf.scaling)}</td></tr></table></div>`;
    sec+=`<div class="sec" id="sx-edge"><h3>Edge cases and how each is handled</h3>${ul(dp.edge_cases)}</div>`;
    sec+=`<div class="sec" id="sx-tests"><h3>Test cases</h3><table class="xtab"><tr><th>Test</th><th>Given</th><th>Expect</th></tr>${(dp.tests||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.given)}</td><td>${esc(x.expect)}</td></tr>`).join('')}</table></div>`;
    sec+=`<div class="sec" id="sx-cost"><h3>Where it saves cost</h3>${ul(dp.cost_levers)}</div>`;
    sec+=`<div class="sec" id="sx-fb"><h3>Feedback and analytics events</h3><h4>Feedback captured or used</h4>${ul(dp.feedback_events)}<h4>Events emitted</h4><table class="xtab"><tr><th>Event</th><th>Fields</th><th>When</th></tr>${(dp.analytics_events||[]).map(x=>`<tr><td class="mono">${esc(x.name)}</td><td>${(x.fields||[]).map(f=>`<span class="pill">${esc(f)}</span>`).join('')}</td><td>${esc(x.when)}</td></tr>`).join('')}</table></div>`;
    if((dp.papers||[]).length||(dp.repos||[]).length) sec+=`<div class="sec refs" id="sx-res"><h3>Research behind it</h3>${(dp.papers||[]).map(x=>{const r=D.refs[x.ref];return `<p><a href="${esc(r.url)}" target="_blank" rel="noopener"><b>${esc(r.cite)}</b></a><br><i>Result we rely on:</i> ${esc(x.key_idea)}<br><i>Used here:</i> ${esc(x.how)}</p>`}).join('')}${(dp.repos||[]).length?`<h4>Open-source implementations studied</h4><ul>${dp.repos.map(x=>`<li><a href="${esc(D.refs[x.ref].url)}" target="_blank" rel="noopener">${esc(x.name)}</a>: ${esc(x.take)}</li>`).join('')}</ul>`:''}${dp.industry?`<h4>How others build it</h4><p>${esc(dp.industry)}</p>`:''}</div>`;
    const rr=R(dp.refs);
    sec+=`<div class="sec refs" id="sx-refs"><h3>References</h3>${rr.length?`<ul>${rr.map(r=>`<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.cite)}</a></li>`).join('')}</ul>`:'<p>None cited for this node.</p>'}</div>`;
  } else sec+=contract;
  $('main').innerHTML=`<div class="card deep"><div class="hd"><span class="badge" style="background:${K.fill};border-color:${K.stroke}">${esc(K.name)}</span><span class="badge" style="border-color:#cbd5e1">Stage ${esc(st.n)}: ${esc(st.title)}</span><h2>${esc(c.label)}</h2><div style="color:var(--mut)">${esc(c.sub)}</div>${c.line?`<div style="margin-top:8px;white-space:pre-line">${esc(c.line)}</div>`:''}</div>${sec}
  <div class="nb"><div><h4>Receives from</h4>${list(up)}</div><div><h4>Hands to</h4>${list(down)}</div></div></div>
  <p class="hint"><a href="#/g/${st.id}/${grp.id}">← Back to group: ${esc(grp.title)}</a> &nbsp; <a href="#/s/${st.id}">← Stage ${esc(st.n)}</a></p>`;
}

/* ---------- cross-cutting pages ---------- */
function xView(id){
  const x=(D.xc||[]).find(v=>v.id===id); 
  if(id==='refs'){
    crumbs([{t:'Overview',href:'#/'},{t:'References'}]);
    $('title').innerHTML='<span class="lvl">Sources</span>Research and references';
    const by={}; D.refs.forEach((r,i)=>{(by[r.topic||'Other']=by[r.topic||'Other']||[]).push([i,r])});
    $('main').innerHTML=`<div class="card deep"><div class="sec refs" style="border:0">${Object.entries(by).sort().map(([k,v])=>`<h4>${esc(k)}</h4><ul>${v.map(([i,r])=>`<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.cite)}</a></li>`).join('')}</ul>`).join('')}</div></div>`;
    return;
  }
  if(!x){location.hash='#/';return}
  crumbs([{t:'Overview',href:'#/'},{t:x.title}]);
  $('title').innerHTML=`<span class="lvl">Cross-cutting</span>${esc(x.title)}`;
  $('main').innerHTML=`<p class="sub">${esc(x.intro)}</p><div class="card deep">${x.sections.map(s=>`<div class="sec"><h3>${esc(s.h)}</h3>${s.p?`<p>${esc(s.p)}</p>`:''}${s.kind==='table'?`<div style="overflow:auto"><table class="xtab"><tr>${s.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${s.rows.map(r=>`<tr>${r.map(c=>`<td>${Array.isArray(c)?c.map(f=>`<span class="pill">${esc(f)}</span>`).join(''):esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`:ul(s.rows)}</div>`).join('')}</div>`;
}
function ul(a){return `<ul>${(a||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}

function route(){
  $('tip').style.display='none';
  const h=location.hash.replace(/^#\/?/,'').split('/');
  window.scrollTo(0,0);
  if(h[0]==='s') stageView(h[1]); else if(h[0]==='g') groupView(h[1],h[2]); else if(h[0]==='c') cardView(h[1]); else if(h[0]==='x') xView(h[1]); else overview();
}
addEventListener('hashchange',route);
addEventListener('keydown',e=>{ if(e.key==='Escape'){ const h=location.hash.split('/'); if(h[1]==='c'){const q=D.comps[h[2]]; location.hash='#/g/'+q.stage+'/'+q.group} else if(h[1]==='g') location.hash='#/s/'+h[2]; else if(h[1]==='s') location.hash='#/'; }});
route();
</script>
