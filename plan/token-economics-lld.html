nd keep 5 [C:066]. Chosen: guidance. Cookbook peak 335,279 to 173,137 is a single synthetic run without dollars [C:006]. The context editing -84 percent claim has no stated baseline [A:268].", "line": "ctx=36,000 -> clear_tool_uses, keep=5\nclear_at_least=5,000; exclude: memory", "dumb": "When the conversation gets long, the provider can drop old tool results. Token Economics asks for that only when the saving is bigger than the cost of rebuilding the cache.", "deep": {"purpose": "Use server-side tool-result clearing (strategy clear_tool_uses_20250919 [C:065]) to cut the context when re-fetchable results dominate. The cookbook case had file reads at 96.3 percent of context [C:006].", "expected": ["Adds context_management with trigger 30,000 to 40,000, keep 5, clear_at_least 3,000 to 5,000.", "Sets exclude_tools for non-re-fetchable tools [C:067].", "Fires only if the break-even test passes.", "Keeps thinking blocks for 1 turn so the thinking cache survives [C:065]."], "not_expected": ["No clearing of results the agent cannot re-fetch.", "No firing on small yield.", "No firing when the client already manages context editing."], "algorithm": {"name": "Break-even clearing", "formula": "fire iff n_remaining * Y * r > P_after * (w - r) and ctx >= trigger", "steps": ["If ctx tokens are below the trigger, stop.", "Estimate Y, the tokens removable above clear_at_least, from the tool-result sizes older than the newest 5.", "Estimate P_after, the tokens at and after the first cleared block (these must be re-written).", "Estimate remaining turns n_remaining from the task baseline for this tenant.", "If the break-even test passes, add context_management with keep and exclude_tools; else emit skip_no_payback."], "params": {"trigger_tokens": "30,000 to 40,000 [C:066]", "keep": "5 [C:066]", "clear_at_least": "3,000 to 5,000 [C:066]", "api_default_trigger": "100,000 [C:065]", "api_default_keep": "3 [C:065]", "thinking_keep_turns": "1 [C:065]"}}, "math": {"definitions": ["Y = tokens , P_after=20,000, n_remaining=40", "expect": "n*=96 above 40, skip_no_payback"}, {"name": "exclude", "given": "memory tool results in range", "expect": "memory results kept"}, {"name": "client_owns", "given": "request already has context_management", "expect": "skip_client_owns"}], "cost_levers": ["Lower tokens read per turn.", "Avoids a compaction call later."], "feedback_events": ["Cache re-write tokens after clear.", "Tasks that re-fetch cleared content.", "Clear frequency per session."], "analytics_events": [{"name": "token_economics.clear.fired", "fields": ["session_id", "ctx_tokens", "y_tokens", "p_after", "n_remaining"], "when": "clear requested"}, {"name": "token_economics.clear.skip", "fields": ["session_id", "reason"], "when": "no clear"}, {"name": "token_economics.clear.refetch", "fields": ["session_id", "tool"], "when": "cleared content fetched again"}], "papers": [{"ref": 154, "key_idea": "Cookbook peak 335,279 to 173,137 tokens; one synthetic task.", "how": "Illustrates yield only; no dollars."}], "repos": [], "industry": "Anthropic documents clear_tool_uses_20250919 with default trigger 100,000 and keep 3, and guidance to start at 30,000 to 40,000 [C:065, C:066]. OpenAI and Google have no equivalent server-side strategy in corpus.", "refs": [152, 151, 153, 23, 154, 155, 156, 148, 68, 9]}}, "compact": {"label": "Compaction guard", "sub": "Last resort, restart at 3", "kind": "guard", "stage": "context", "group": "ctx", "inn": "Context tokens, window size, compaction count in session, harness compaction setting.", "out": "Advisory flag or hook response: allow, warn, or recommend restart. Optional summary instructions.", "store": "Reads harness thresholds from adapters. Writes compaction count and cost per session.", "fail": "Fail open. Let the harness compact on its own. Token Economics only counts and warns.", "req": "RQ-D-014, RQ-D-009, RQ-D-008  Sources: C:112, C:106, C:007, C:089, C:006, A:224, C:055, C:074, C:090, C:130, C:133, C:122", "prop": "Counting and the restart recommendation are sourced rules. Using PreCompact hooks as an advisory channel is a DevX design; hooks can be disabled so nothing here enforces.", "hard": "Threshold conflict: about 50 percent [C:112] vs about 90 percent [C:106] vs window minus 33,000 [C:007]. Cache effect conflict: C:112 says compaction destroys the cache. C:055 says it reuses the parent prefix at a 5-minute time to live (TTL). A:224 shows a miss and a net loss. No head-to-head test. Token Economics measures, and does not set the threshold.", "line": "compaction #3 at 188,000 tok (window 200,000)\nrecommend: restart with handoff file", "dumb": "Compaction asks the model to summarise the whole chat. It costs real money and loses detail. Token Economics counts them and suggests a fresh start after three.", "deep": {"purpose": "Treat compaction as a last resort. Each one is a model call, can miss the cache, and drops specifics [C:112, C:106, C:006].", "expected": ["Counts compactions per session and shows the count to the user.", "Warns before the harness compacts if the context is below the break-even point.", "Recommends a restart with a handoff file at the third compaction.", "Uses PreCompact only to add summary instructions or to block, when hooks exist [C:074]."], "not_expected": ["No Token Economics-run summary call.", "No compaction below about 10 events [C:133].", "No claim that the compaction threshold is tuned; no head-to-head evidence exists."], "algorithm": {"name": "Late-compaction advisor", "formula": "warn if n_compactions >= 2; recommend_restart if n_compactions >= 3", "steps": ["Read context tokens from the usage row after each response.", "Detect a compaction by a drop in input tokens above 50 percent with a summary-sized block.", "Increment the per-session counter and store the cost of the call from the ledger.", "Run the break-even test (see math) before an expected compaction and warn if it fails.", "At count 3, emit recommend_restart with a handoff-file hint r per session."}, "edge_cases": ["Harness compacts on its own at an unexpected point: detect by the token drop and count it.", "Session is resumed: reload the counter from metadata.", "Two compactions within 3 turns: flag as thrash.", "No hooks present: advisory shown only in the dashboard."], "tests": [{"name": "count_three", "given": "three detected compactions", "expect": "recommend_restart on the third"}, {"name": "break_even_fail", "given": "H=40,000 S=2,783 n_remaining=5", "expect": "pays false, warn"}, {"name": "break_even_pass", "given": "H=125,000 S=2,783 n_remaining=40, Sonnet 5.5", "expect": "pays true (n*=33.3)"}, {"name": "thrash", "given": "two compactions 2 turns apart", "expect": "event token_economics.compact.thrash"}, {"name": "short_session", "given": "8 events at threshold", "expect": "no warning needed, advisory off"}], "cost_levers": ["Fewer summary calls.", "Fewer cache misses after compaction."], "feedback_events": ["Compactions per session.", "Cost of each compaction.", "Post-compaction success rate."], "analytics_events": [{"name": "token_economics.compact.detected", "fields": ["session_id", "h_tokens", "s_tokens", "cost_usd", "count"], "when": "compaction seen"}, {"name": "token_economics.compact.warn", "fields": ["session_id", "reason"], "when": "advisory raised"}, {"name": "token_economics.compact.restart_rec", "fields": ["session_id", "count"], "when": "third compaction"}], "papers": [{"ref": 157, "key_idea": "One compaction at 125,000 tokens costs $0.40, about 21 cached turns; secondary source.", "how": "Worked example input."}, {"ref": 149, "key_idea": "LLM condensers cost 24 to 94 percent more with no significant quality gain.", "how": "Reason to avoid summaries below 10 events."}], "repos": [], "industry": "Compaction thresholds differ by harness. Gemini CLI is about 50 percent, Claude Code about 89 percent, Codex about 90 percent [C:112]. OpenHands condensers report 54 vs 53 percent solve [C:122].", "refs": [157, 144, 158, 159, 154, 46, 68, 12, 31, 148, 149, 150]}}, "mtok": {"label": "Max-tokens enforcer", "sub": "Hard cap on every call", "kind": "guard", "stage": "context", "group": "ctx", "inn": "Request body, route class, tenant policy, model id, worst-case reserve input.", "out": "Request with a hard max_tokens value, or a rejection when none can be set.", "store": "Reads per-tenant and per-model cap policy. Writes cap value into the reservation record in the budget path.", "fail": "Fail closed. Reject with 503 policy_unavailable if no cap can be resolved. An uncapped call makes the worst-case reserve unbounded.", "req": "RQ-D-015, RQ-D-016, RQ-D-017  Sources: C:073, C:093, A:197, A:052, C:027, C:136, A:104", "prop": "Cap values, floors and the 503 behaviour are DevX proposals. The corpus gives no numeric default.", "hard": "Not in corpus: a safe default cap per task class. A 300-token cap broke 7 of 25 hard tasks [A:052]; OpenAI guidance reserves at least 25,000 tokens for reasoning [A:197]. Effort control does not cap tokens [C:073]. Hosted-API support for output-length control methods is not in corpus.", "line": "max_tokens missing -> set 8,192 (tenant policy)\nreserve = 8,192 x output price", "dumb": "Every call must say how long the answer may be. Token Economics adds a limit if the client forgot, so one runaway answer cannot burn the budget.", "deep": {"purpose": "Put an upper bound on output tokens. At a 96.3 percent cache hit rate they are 2.7 percent of tokens and 51.1 percent of dollars [C:027].", "expected": ["Sets max_tokens on every call that lacks one.", "Lowers an oversized client value to the policy cap only when policy says so.", "Applies a per-class floor so the cap cannot be set below the floor.", "Passes the final value to the reserve step."], "not_expected": ["No reliance on effort or prompt text to limit output [C:073, C:136].", "No cap below the class floor.", "No silent change of a value the client set lower than policy."], "algorithm": {"name": "Resolve and enforce cap", "formula": "cap = clamp(client_value or policy_default, floor_class, ceiling_policy)", "steps": ["Resolve class (interactive, batch, reasoning) from route and model.", "Read policy default, floor and ceiling for tenant and class.", "If client value is absent, use the default. If present, clamp to the ceiling.", "If the resolved value is below the floor, raise to the floor and emit a warning event.", "Write the value to the request and the reservation record."], "params": {"default_cap": "per tenant policy (DevX proposal, no corpus value)", "floor_cap": "per class (DevX proposal; 300 broke 7 of 25 tasks [A:052])", "reasoning_reserve_tokens": "at least 25,000 for OpenAI reasoning [A:197]"}}, "security": ["The tenant cannot raise its own ceiling through a request header; only policy sets it.", "Rejections return a stable error code without echoing the request body."], "performance": {"slo": "Under 0.5 ms added latency p99 (DevX proposal).", "complexity": "Constant time.", "scaling": "Stateless."}, "edge_cases": ["Client sets max_tokens above the ceiling.", "Model uses reasoning tokens that count inside max_tokens; reserve must include them.", "Model id unknown to policy: reject, not default (unpriced models escape budgets [A:242]).", "Batch route with larger ceiling."], "tests": [{"name": "missing", "given": "no max_tokens, default 8,192", "expect": "request sent with 8,192"}, {"name": "above_ceiling", "given": "client 64,000, ceiling 32,000", "expect": "clamped to 32,000"}, {"name": "below_floor", "given": "client 300, floor 1,024 for class hard", "expect": "raised to 1,024, warning event"}, {"name": "no_policy", "given": "policy unreadable", "expect": "503 policy_unavailable, no dispatch"}, {"name": "reasoning_reserve", "given": "OpenAI reasoning model, cap 8,000", "expect": "reserve adds 25,000 reasoning tokens"}], "cost_levers": ["Bounds output cost per call.", "Makes the reserve step exact."], "feedback_events": ["Truncation rate (stop_reason max_tokens).", "Retry rate after truncation.", "Floor warnings per class."], "analytics_events": [{"name": "token_economics.mtok.set", "fields": ["tenant", "model", "class", "value", "source"], "when": "cap applied"}, {"name": "token_economics.mtok.floor", "fields": ["tenant", "model", "client_value", "floor"], "when": "value raised to floor"}, {"name": "token_economics.mtok.reject", "fields": ["tenant", "reason"], "when": "no cap resolvable"}], "papers": [{"ref": 110, "key_idea": "maxOutputTokens=300 broke 7 of 25 hard tasks.", "how": "Basis for the per-class floor."}], "repos": [{"ref": 3, "name": "LiteLLM", "take": "Per-key budgets and budget fallbacks as the surrounding enforcement path."}], "industry": "Gateways usually forward max_tokens untouched and rely on budgets after the fact. Token Economics sets the cap before dispatch so the reserve is bounded.", "refs": [20, 160, 41, 110, 95, 13, 161]}}, "ilint": {"label": "Instruction-file linter", "sub": "CLAUDE.md 200 lines, AGENTS.md 32 KiB", "kind": "guard", "stage": "context", "group": "ctx", "inn": "Instruction files (CLAUDE.md, AGENTS.md, MEMORY.md), skill descriptions, file sizes.", "out": "Lint findings with file path, size, limit and severity.", "store": "Reads local files at scan time. Writes counts and findings (no file text) to the policy store.", "fail": "Fail open. Advisory only. A failed scan blocks nothing.", "req": "RQ-D-018, RQ-D-019  Sources: C:077, C:036, A:269, C:075, C:079, C:104, C:028, C:074", "prop": "Finding severity and the confidence interval (CI) and SessionStart scan placement are DevX proposals. Saving figure is not in corpus.", "hard": "Saving from instruction-file caps is not in corpus. Stale skills are re-billed with each prefix [C:028], but no size is given. Caps differ by harness: 200 lines vs 32 KiB vs 25 KB.", "line": "AGENTS.md 41 KiB > 32 KiB: truncated silently\nCLAUDE.md 214 lines > 200: warn", "dumb": "Rule files are read on every turn, so long ones cost money and some get cut off with  Economics flags those phrases and any timestamp at the top of a prompt.", "deep": {"purpose": "Catch prompt wording that raises reasoning cost without raising success, and volatile text that breaks cache reuse.", "expected": ["Flags default text asking for multiple approaches (2.4 to 7.4x reasoning tokens) [C:026].", "Flags default \"think deeply\" wording (1.6 to 2.2x) [C:026].", "Flags timestamps and per-request values in the first lines of a prompt (reuse fell 87 to 3 percent [A:224]).", "Reports how many findings exist per tenant."], "not_expected": ["No rewrite of prompts.", "No default recommendation to add \"be concise\" [A:104].", "No claim that the wording changes success; the evidence shows no gain, not harm."], "algorithm": {"name": "Pattern lint", "formula": "finding if pattern matches in scope", "steps": ["Load pattern list from policy (multi-approach, deep-thinking, stop-early, volatile-top).", "Scan prompt files; for volatile-top, check the first 40 lines for date, time or uuid patterns (40 is a DevX proposal).", "Attach the sourced cost range to each finding.", "Send counts only."], "params": {"multi_approach_cost": "2.4 to 7.4x reasoning tokens [C:026]", "deep_think_cost": "1.6 to 2.2x [C:026]", "volatile_top_effect": "reuse 87 to 3 percent, cost 2.2 to 2.9x [A:224]", "stop_early_effect": "3 of 5 hidden-test failures [C:026]"}}, "security": ["Scan locally; send no prompt text.", "Pattern list is policy-controlled so a tenant cannot hide findings by editing it locally."], "performance": {"slo": "Under 500 ms per repo (DevX proposal).", "complexity": "Linear in prompt file size.", "scaling": "Runs on the developer machine or confidence interval (CI)."}, "edge_cases": ["Pattern appears inside a quoted example.", "Date appears in a footer, not the top.", "Non-English prompt text.", "Template variable that renders to a timestamp at runtime."], "tests": [{"name": "multi", "given": "prompt contains \"try multiple approaches\"", "expect": "finding with range 2.4 to 7.4x"}, {"name": "timestamp_top", "given": "line 2 is \"Today is 2026-11-09\"", "expect": "volatile-top finding"}, {"name": "timestamp_footer", "given": "date on line 300", "expect": "no finding"}, {"name": "clean", "given": "plain prompt", "expect": "zero findings"}, {"name": "no_text", "given": "any finding", "expect": "contains no prompt text"}], "cost_levers": ["Lower reasoning tokens.", "Higher prefix reuse."], "feedback_events": ["Findings resolved.", "Reasoning tokens per task before and after."], "analytics_events": [{"name": "token_economics.pwl.finding", "fields": ["rule", "file", "severity"], "when": "each finding"}, {"name": "token_economics.pwl.scan", "fields": ["files", "findings"], "when": "each scan"}], "papers": [{"ref": 116, "key_idea": "4,644 preregistered runs: multiple-approaches wording cost 2.4 to 7.4x reasoning tokens with no success gain.", "how": "Pattern and cost ranges."}, {"ref": 161, "key_idea": "Be concise cut GPT-3.5 accuracy 27.69 percent.", "how": "Reason brevity wording is not a default."}], "repos": [], "industry": "Prompt linters usually check style. Cost-aware wording lint is new in this corpus.", "refs": [116, 46, 39, 68, 161]}}, "meta": {"label": "Metadata store", "sub": "Usage, cost, ids, no content", "kind": "store", "stage": "insight", "group": "store", "inn": "Metadata-only mirror rows from the ledger, attributed rows from attr, and retention rules.", "out": "Query-ready tables for dashboards and anomaly checks. No prompt or response content.", "store": "Writes and reads metadata tables (usage, cost, ids, hit rates, canary results). Retention expiry set by the retention component.", "fail": "Fail open: dashboards may lag, and requests are never blocked. The ledger remains the source of truth and can rebuild the store.", "req": "RQ-B-041, RQ-B-042, RQ-B-037, RQ-B-046, RQ-B-047, RQ-B-045  Sources: A:217, C:074, C:052, C:054, C:076, C:003", "prop": "Expiry rules and the rebuild-from-ledger approach are DevX proposal ds."], "tests": [{"name": "join", "given": "hook p3 and OTel prompt.id p3 and gateway row", "expect": "one attributed row with cost from gateway"}, {"name": "subagent", "given": "query_source agent.builtin.general-purpose", "expect": "spend credited to subagent, not main"}, {"name": "cps", "given": "task with 3 attempts costing $0.30, $0.40, $0.25, one success", "expect": "CPS $0.95"}, {"name": "waste", "given": "failed spend $32 of $100", "expect": "waste share 0.32"}, {"name": "unattributed", "given": "row with no prompt_id", "expect": "stored with missing_key prompt_id"}], "cost_levers": ["Shows which callers, subagents and tasks drive spend, so the biggest lever is chosen first.", "Failed-run waste (32 percent of spend in C:028) is a direct target for the loop guard."], "feedback_events": ["attr.row_attributed", "attr.unattributed"], "analytics_events": [{"name": "token_economics.attr.row", "fields": ["session_id", "prompt_id", "caller", "query_source", "model_id", "cost_usd"], "when": "A row is attributed."}, {"name": "token_economics.attr.unattributed", "fields": ["session_id", "missing_key"], "when": "A join key is missing."}], "papers": [{"ref": 91, "key_idea": "Failed runs are 17 percent of tasks and 32 percent of spend. 51 percent of spend falls after the first repeated failure.", "how": "Sets the waste share metrics."}, {"ref": 128, "key_idea": "Same-task runs differ up to 30x in tokens.", "how": "Task-level, not token-level, attribution."}], "repos": [{"ref": 21, "name": "ccusage", "take": "Local JSONL usage reports for many agent CLIs, a source for replay."}], "industry": "Claude Code OTel attaches prompt.id, query_source, agent.name and skill.name to metrics and events. Token Economics joins them with gateway rows and prefers the gateway cost.", "refs": [10, 18, 32, 12, 5, 91, 150, 166, 6, 128]}}, "logp": {"label": "Content-logging policy", "sub": "Metadata only, OTEL_LOG opt-in", "kind": "admin", "stage": "insight", "group": "store", "inn": "Tenant policy flags and client OTel settings (OTEL_LOG_USER_PROMPTS and related).", "out": "The effective content-logging policy per tenant and harness, with an audited opt-in and expiry.", "store": "Reads and writes policy records through the policy store. Writes opt-in events to the audit log.", "fail": "Fail closed for content: if the policy is unreadable, content logging stays off. Metadata collection continues.", "req": "RQ-B-042, RQ-B-043, RQ-B-044  Sources: A:217", "prop": "Per-tenant opt-in with expiry, the audit event and the enforcement through managed settings are DevX proposals. The corpus says content logging is opt-in.", "hard": "Open: Codex OpenTelemetry (OTel) event names and logging flags are not in the corpus. Retention duration for opted-in content is not in the corpus. Developers can change local env vars unless managed settings pin them.", "line": "tenant t3: OTEL_LOG_USER_PROMPTS=off (default)\noptin: none; audit: none", "dumb": "By default Token Economics keeps counts and costs only, never what people wrote. A team can switch content logging on, but it is written down and expires.", "deep": {"purpose": "Keep content out of the system by default. Prompt, tool and response logging are opt-in switches in Claude Code, and this component holds the policy for them.", "expected": ["Default state: OTEL_LOG_USER_PROMPTS, OTEL_LOG_TOOL_DETAILS, OTEL_LOG_TOOL_CONTENT, OTEL_LOG_ASSISTANT_RESPONSES and OTEL_LOG_RAW_API_BODIES are all off [A:217].", "Pins the values through managed settings so developers cannot turn content logging on locally.", "An opt-in names the tenant, the flags, the reason and an expiry date, and is written to the audit log.", "The OTel receiver drops content fields if a client sends them without an active opt-in.", "Policy is versioned in the policy store."], "not_expected": ["No content storage by default.", "No silent opt-in by a client env var.", "No retention logic. The retention component owns expiry."], "algorithm": {"name": "Default-of oposal)", "budget_alert_thresholds": "75, 90 and 100 percent [A:213, C:116]"}}, "security": ["User-level views need a role. Default views show team aggregates.", "No content fields exist in the source data.", "Exports are logged in the audit log."], "performance": {"slo": "Dashboard loads under 3 seconds at the 95th percentile (P95), data lag under 5 minutes (DevX proposal).", "complexity": "Reads precomputed rollups.", "scaling": "Rollups by tenant and day."}, "edge_cases": ["A caller with few requests gives a noisy hit rate. Show the sample size.", "A new caller has no baseline. Show absolute value only.", "Gateway-derived baselines have selection bias [C:054].", "Spend of subagents must not roll into the parent without a label."], "tests": [{"name": "percentile", "given": "user totals 10, 20, 30, 40, 100", "expect": "median 30, P95 above 40, mean 40"}, {"name": "own_baseline", "given": "caller baseline 0.90, now 0.40 while account is 0.77", "expect": "alert on caller"}, {"name": "waste_share", "given": "failed spend $32 of $100", "expect": "0.32 shown"}, {"name": "cps_headline", "given": "spend $0.95 over 1 success", "expect": "CPS $0.95, no token-savings headline"}], "cost_levers": ["Pointing at the tail (P95) and the worst caller finds the largest saving.", "Waste share points at loop guard and turn cap targets."], "feedback_events": ["dash.guard_metrics", "dash.caller_alert"], "analytics_events": [{"name": "token_economics.dash.view", "fields": ["view", "tenant_id", "role"], "when": "A dashboard is opened."}, {"name": "token_economics.dash.guard_metrics", "fields": ["metric", "value", "baseline"], "when": "Guard metrics are published."}], "papers": [{"ref": 5, "key_idea": "Account hit rate 77 percent hid a cron near 0 percent; blanket 1h TTL made the bill 8.6 percent worse.", "how": "Hit rate is shown per caller against its own baseline."}, {"ref": 71, "key_idea": "Price rank reversed in 32 percent of comparisons.", "how": "Rank by cost per task, not list price."}], "repos": [], "industry": "Gateway vendors publish per-agent hit rates and spend percentiles from their own traffic [C:054], with selection bias. Token Economics computes the same views from the customer's own ledger.", "refs": [6, 98, 97, 84, 5, 19, 91, 95, 146, 71, 150]}}, "anom": {"label": "Anomaly detector", "sub": "DevX proposal, no corpus method", "kind": "calc", "stage": "insight", "group": "view", "inn": "Cost and token series per caller, model and tenant from the metadata store.", "out": "Alerts on outliers, with the series, the baseline and the likely driver.", "store": "Reads meta series. Writes alert records and a per-series baseline state.", "fail": "Fail open: it only alerts. A broken detector never blocks traffic. A silent detector raises a heartbeat alert.", "req": "RQ-B-050, RQ-B-051  Sources: A:213, C:116, C:054, C:028, C:136", "prop": "The whole method is a DevX proposal. The corpus has no anomaly-detection method beyond budget alerts at 75, 90 and 100 percent. The outlier method is chosen by Token Economics. No source supplies it.", "hard": "Open: no corpus method, threshold or false-alert rate. Budget alerts at 75, 90 and 100 percent are sourced [A:213, C:116] and live in the alert component. The detector needs a pilot to set thresholds.", "line": "cron-nightly cost/day $4 -> $31 (z=7.2, 14d base)\nalert: new tool schema bloat? top driver: input", "dumb": "This part watches the spend lines and shouts when something jumps far above normal. It only warns, it never stops anything.", "deep": {"purpose": "Catch sudden or slow cost jumps that fixed budget thresholds miss, such as a cron that loses its cache or a loop that runs all night.", "expected": ["Runs on daily and hourly series per caller and per model.", "Uses a trailing median and median absolute deviation (MAD) baseline and flags a score above a set limit (DevX proposal).", "Attaches the likely driver: input, output, cache read, cache write, or request count.", "Suppresses repeat alerts for one series for a set period.", "Publishes a heartbeat so a silent detector is itself an alert."], "not_expected": ["No traffic blocking. Budgets and the loop guard block.", "No content use.", "No claim of a corpus-backed method."], "algorithm": {"name": "Median and MAD outlier score (DevX proposal)", "formula": "z = 0.6745 x (x - median) / MAD over a trailing window", "steps": ["Aggregate the series per caller and model at hourly and daily grain.", "Keep a trailing window (14 days proposed) with at least 7 points.", "Compute median and MAD. Score the newest point.", "If the score exceeds the limit (proposed 5) and the absolute rise exceeds a floor in USD, raise an alert.", "Break the rise into bucket and request-count drivers.", "Write the alert and start a suppression window."], "params": {"window_days": "14 (DevX proposal)", "min_points": "7 (DevX proposal)", "score_limit": "5 (DevX proposal)", "absolute_floor_usd": "set per tenant (DevX proposal)", "budget_alert_levels": "75, 90, 100 percent, handled by the alert component [A:213, C:116]"}}, "security": ["Alerts carry series ids and numbers, no content.", "Alert routing goes through the configured channels with tenant scope.", "Thresholds changes are audited."], "performance": {"slo": "Hourly alert within 15 minutes of the hour closing (DevX proposal).", "complexity": "O(w) per series for window w.", "scaling": "Series count equals callers times models. Evaluate in batch."}, "edge_cases": ["New caller with under 7 points: no alert, status warming up.", "Planned load test looks like an anomaly. Allow a silence window by operators.", "Price change shifts cost for every caller at once. Alert once at the model level.", "Weekend dips cause false alarms in a day-based window.", "Failed runs are 32 percent of spend on average [C:028], so a spike in failures is a driver, not an anomaly by itself."], "tests": [{"name": "spike", "given": "series 4,4,5,4,4,5,4 then 31", "expect": "alert raised, driver input"}, {"name": "warming", "given": "series with 3 points", "expect": "no alert, status warming_up"}, {"name": "suppress", "given": "two spikes in one hour on one series", "expect": "one alert"}, {"name": "heartbeat", "given": "detector silent for 2 hours", "expect": "heartbeat alert fires"}, {"name": "price_change", "given": "all callers +20 percent after a price row change", "expect": "one model-level alert"}], "cost_levers": ["Early alerts catch cost leaks such as lost cache or loops before the invoice."], "feedback_events": ["anom.alert", "anom.heartbeat_missed"], "analytics_events": [{"name": "token_economics.anom.alert", "fields": ["series", "score", "value", "baseline", "driver"], "when": "A series crosses the limit."}, {"name": "token_economics.anom.heartbeat", "fields": ["last_run", "series_count"], "when": "The detector finishes a run."}], "papers": [], "repos": [], "industry": "The corpus covers budget alerts at 75, 90 and 100 percent [A:213, C:116] and nothing more. Median and MAD scoring is a common, simple method and is a proposal here.", "refs": [97, 84, 6, 91, 13]}}, "evalh": {"label": "Eval harness", "sub": "Paired runs, isolated cache per arm", "kind": "eval", "stage": "evalroll", "group": "eval", "inn": "Arm definitions (baseline, candidate), task set, repeat count, success flags, billed cost per attempt.", "out": "Run plan, per-arm result table, and a ship, hold or revert verdict with the numbers behind it.", "store": "Reads the gold set and the ledger. Writes run manifests, arm results and verdicts.", "fail": "Fail closed for shipping. With no verdict, an optimisation stays off. Fail open for traffic: production requests are never blocked by the harness.", "req": "RQ-D-007, RQ-D-027, RQ-D-028, RQ-D-029, RQ-D-032, RQ-D-033, RQ-D-034, RQ-D-035, RQ-D-036, RQ-D-037, RQ-D-038, RQ-D-045, RQ-D-048, RQ-D-042  Sources: C:024, C:026, C:028, C:025, C:053, A:006, A:122, C:132, C:081, A:002, A:001, C:030, A:052", "prop": "Run manifest format and the log field list are DevX proposals. Test design rules are sourced.", "hard": "Not in corpus: formal power formulas and minimum test duration (Perplexity ran 2 weeks [A:272]). Also missing: an acceptable quality margin. C:025 accepted about -4 points for -23.6 percent cost, a business call. Whether public scores predict our tasks is unknown. Optimisations do not transfer between harnesses (Headroom +48 percent vs -12.49 percent [C:024]).", "line": "B: mask M=10 vs A: raw, 100 tasks x 3\ncost/solve 0.82 [0.74,0.91], pass -1.1 pp", "dumb": "Before any saving goes live, this runs the old way and the new way on the same tasks. It only says yes if cost per solved task drops and the solve rate holds.", "deep": {"purpose": "Run paired A/B tests of every optimisation. Decide with cost per successful task (CPS), which is the cost of all attempts divided by successes. Never decide on token savings.", "expected": ["Pairs arms by task, with repeats, and a baseline arm on the same tasks.", "Uses a separate cache namespace per arm, or spaces the runs [C:024].", "Charges the optimisation own overhead (a router call, a summary call) to the task [C:026, C:028].", "Logs prompt variant, effort, harness version, tool surface, retries, compaction and whether the optimisation fired."], "not_expected": ["No verdict from token counts alone.", "No voting, ensembles or agent teams without a measured CPS gain [A:122, C:132].", "No tuning on the held-out tasks."], "algorithm": {"name": "Preregistered paired arm test", "formula": "ship iff CI_upper(CPS_B/CPS_A) < 1 and success_lower_bound(B - A) >= -delta", "steps": ["Freeze the plan: tasks, repeats, primary metric CPS, success non-inferiority bound delta, stop rules.", "Run both arms on the same tasks with isolated cache state and a verifiable success flag.", "Hand attempt rows to stats for the clustered bootstrap CIs.", "Check guard metrics: patch-apply, empty-patch, format validity, fix-commit ratio [C:053].", "Emit verdict ship, hold or revert, with reasons and the manifest."], "params": {"baseline_arm": "required [C:024]", "repeats": "several per cell; 3 runs per cell in the Lite study [A:060]", "sample_sizes_seen": "100 tasks [C:025]; about 38 to 45 effective tasks per arm [C:024]; 60 tasks over 6 repos [C:028]", "delta": "set before the test; value is a business call, no corpus default", "turn_cap_start": "P75 of own per-model baseline, reject P25 [C:025]"}}, "security": ["Eval prompts and repos may contain customer code; keep them in the tenant-scoped store and never export content.", "Only the evaluation role can change a run manifest after freeze; changes create a new run id."], "performance": {"slo": "Verdict within 1 hour of the last attempt row (DevX proposal).", "complexity": "Linear in attempts; bootstrap is delegated to stats.", "scaling": "Runs are batch jobs; attempt count is tasks x repeats x arms."}, "edge_cases": ["An arm hits the cache of the other arm: invalidate the run and rerun with spacing.", "A task has no verifiable success flag: exclude it and log the count.", "Candidate fires on fewer than 10 percent of tasks: report per-fired subset and overall.", "Public benchmark baseline is 96 to 98 percent: use hard private tasks instead [C:024]."], "tests": [{"name": "paired", "given": "100 tasks, 3 repeats, 2 arms", "expect": "600 attempt rows, each task has both arms"}, {"name": "overhead", "given": "router call costs $0.004 on a $0.050 attempt", "expect": "attempt cost recorded as $0.054"}, {"name": "ni_breach", "given": "success delta -5 pp with delta bound -3 pp", "expect": "verdict revert, reason ni_breach"}, {"name": "token_only", "given": "tokens -30 percent but CPS ratio 1.04", "expect": "verdict hold, reason cps_not_lower"}, {"name": "cache_carryover", "given": "arm B read tokens from arm A namespace", "expect": "run invalid"}], "cost_levers": ["Stops harmful optimisations before rollout.", "Finds which optimisation is worth its overhead."], "feedback_events": ["Verdict reversals after rollout.", "G ainst a learning curve. Public-score validity for our tasks: not in corpus. Router labels must not come from one dominant model [A:019].", "line": "gold v7: 350 tasks, Lite 80, held-out 60\nlabels: 5 models, strong share 38%", "dumb": "A private set of real tasks with known right answers, so tests use our work and not public puzzles. Some tasks stay hidden from tuning so we can catch overfitting.", "deep": {"purpose": "Provide the task set that stats and evalh need. Keep it private and hard, because public sets saturate (baseline 96 to 98 percent [C:024]).", "expected": ["Holds our own repo tasks with hard cases and a verifiable success check each.", "Keeps a Lite subset of 80 tasks. It tracked the full 350 within 0.81 pp at 25.3 percent of the cost [A:060].", "Reserves a held-out split that no tuning job reads [A:052].", "Labels router data from several models so no single model dominates [A:019]."], "not_expected": ["No public benchmark as the only set.", "No tuning on held-out tasks.", "No labels from a single dominant model."], "algorithm": {"name": "Versioned split with Lite subset", "formula": "gold = tune + heldout; lite = stratified sample(gold, 80)", "steps": ["Collect tasks with a checker and a repo snapshot.", "Stratify by repo, language and difficulty; draw the Lite subset of 80.", "Assign the held-out split by hash of task id so it is stable across versions.", "Record the version and the checksum of each task.", "Audit labels: count per model and block a set where one model holds the strong-label majority."], "params": {"lite_size": "80 tasks of 350 [A:060]", "lite_gap": "0.81 pp mean abs diff, held-out max 1.70 pp [A:060]", "lite_cost": "25.3 percent [A:060]", "heldout_penalty_seen": "regex router lost 23.2 points held out [A:052]", "router_labels": "about 1,500 [A:001] or 100 to 1,000 [A:013]"}}, "security": ["Task repos can hold customer code and secrets; store snapshots per tenant with no cross-tenant read.", "Checkers run in a sandbox with no network."], "performance": {"slo": "Gold version build under 10 minutes for 350 tasks (DevX proposal).", "complexity": "Linear in task count.", "scaling": "Batch only; storage grows with repo snapshots."}, "edge_cases": ["A task becomes flaky: remove it and bump the version.", "A new repo enters: add it to both Lite and held-out strata.", "All labels from one model: block the set.", "Held-out task leaks into a prompt: retire it and replace."], "tests": [{"name": "lite_size", "given": "350 tasks", "expect": "lite has 80 tasks, stratified"}, {"name": "holdout_stable", "given": "task id 1042 in v6 and v7", "expect": "same split in both versions"}, {"name": "label_block", "given": "5 labels, 4 from model X", "expect": "set blocked, reason dominant_model"}, {"name": "tuning_guard", "given": "tuning job requests held-out ids", "expect": "request refused"}, {"name": "lite_gap", "given": "full pass 0.6610, lite 0.6607", "expect": "gap 0.03 pp within the 0.81 pp mean seen"}], "cost_levers": ["Lite subset lowers eval cost to 25.3 percent.", "Held-out split prevents wasted rollouts."], "feedback_events": ["Lite vs full gap per version.", "Held-out vs tune gap.", "Flaky task rate."], "analytics_events": [{"name": "token_economics.gold.version", "fields": ["version", "tasks", "lite", "heldout"], "when": "new gold version"}, {"name": "token_economics.gold.leak", "fields": ["task", "job"], "when": "held-out access attempt"}, {"name": "token_economics.gold.label_audit", "fields": ["version", "models", "max_share"], "when": "label audit"}], "papers": [{"ref": 170, "key_idea": "80-task Lite tracked 350 tasks within 0.81 pp at 25.3 percent cost.", "how": "Lite subset size."}, {"ref": 110, "key_idea": "Regex router fell 23.2 points on held-out tasks.", "how": "Reason for a held-out split."}, {"ref": 117, "key_idea": "Routers trained on one dominant model do not generalise.", "how": "Label audit rule."}], "repos": [], "industry": "Public coding sets saturate. Teams that track cost per task keep a private set and a cheap subset for confidence interval (CI).", "refs": [170, 146, 110, 66, 117, 118, 115, 111, 120]}}, "stats": {"label": "Paired bootstrap stats", "sub": "Task-clustered CIs, non-inferiority", "kind": "eval", "stage": "evalroll", "group": "eval", "inn": "Attempt rows per task and arm: cost, success, repeat id.", "out": "Paired cost per successful task (CPS) ratio with a task-clustered bootstrap interval, success difference interval, and a test verdict.", "store": "Reads the ledger and eval rows. Writes interval results with random seed.", "fail": "Fail closed for decisions. If the interval cannot be computed, the verdict is hold. No effect on live traffic.", "req": "RQ-D-029, RQ-D-030, RQ-D-031, RQ-D-026, RQ-D-037  Sources: C:027, C:023, C:026, C:025, C:024, A:052, A:006, A:002, A:001", "prop": "Bootstrap count (10,000), the one-sided level and the stopping rule are DevX proposals. Power formulas are not in corpus.", "hard": "Not in corpus: power formulas, minimum duration, acceptable margin. Derived from R6: log-SD ln(1.34) = 0.29 from the cost dispersion baseline [C:027]; fit it again on our pilot.", "line": "cost/solve ratio 0.82, 95% interval [0.74, 0.91]\nsuccess delta -1.1 pp, bound -3 pp: ok", "dumb": "This works out whether a new setting really saves money or just got lucky. It resamples whole tasks, so one easy task cannot fake a win.", "deep": {"purpose": "Turn paired attempt rows into a trustworthy CPS ratio and a success non-inferiority check. Task-clustered resampling is the method used in C:026.", "expected": ["Resamples tasks, not attempts, with all repeats of a task kept together.", "Computes CPS = sum of all attempt costs / number of successes in each arm.", "Reports the paired ratio CPS(arm)/CPS(baseline) with a confidence interval.", "Tests success against a preset non-inferiority bound."], "not_expected": ["No unpaired comparison when pairs exist.", "No bound chosen after seeing the data.", "No claim of power beyond the pilot fit."], "algorithm": {"name": "Task-clustered paired bootstrap", "formula": "for b in 1..B: resample tasks with replacement; ratio_b = CPS_B^b / CPS_A^b; confidence interval (CI) = quantiles of ratio_b", "steps": ["Group rows by task id; each group holds both arms and all repeats.", "Draw B task samples with replacement using a fixed seed.", "In each sample compute CPS per arm and the ratio; also the success rate difference.", "Take the 2.5 and 97.5 percentiles for the ratio and the 5th percentile for the success difference.", "Ship only if the ratio upper bound is below 1 and the success lower bound is at least the preset bound."], "params": {"B": "10,000 resamples (DevX proposal)", "ci_level": "95 percent (DevX proposal)", "dispersion_baseline": "geometric SD x1.34 per task and arm [C:027]", "pilot_sample_sizes": "about 38 to 45 effective tasks per arm [C:024]; 100 tasks [C:025]", "ni_bound": "preset per optimisation; not in corpus"}}, "math": {"definitions": ["CPS_arm = sum over attempts of cost, divided by count of successes.", "sigma = SD of log cost ratio per task pair; ln(1.34) = 0.29 is the corpus dispersion baseline [C:027].", "n = number of task pairs; delta = relative cost difference to detect."], "formula_full": "ratio = CPS_B / CPS_A;  CI via B task-clustered resamples;  rough pair count n ~= ((z_a + z_b) * sigma / delta_log)^2 where delta_log = ln(1 - delta)", "derivation": "For paired log-ratios with SD sigma, the standard error of the mean is sigma / sqrt(n). At a two-sided 5 percent level and 80 percent power, n is about ((1.96 + 0.84) * sigma / delta_log)^2. The corpus gives sigma but not power targets, so z values are DevX proposals.", "worked_example": "sigma = 0.29 [C:027]. Detect a 10 percent paired cost difference: delta_log = ln(0.9) = -0.105. n = ((1.96 + 0.84) * 0.29 / 0.105)^2 = (7.73)^2 = about 60 task pairs. Compare: 100 tasks in C:025, about 38 to 45 effective tasks in C:024. Check against a pilot SD before use.", "complexity": "O(B * N) for N attempts; B = 10,000 gives about 10^4 passes over the rows.", "failure_modes": ["Too few tasks: wide interval, verdict hold.", "Cache carryover makes arms dependent.", "Heavy tail from a few runaway tasks inflates CPS variance.", "Success rate near 0 or 1: percentile bootstrap becomes unstable."], "calibration": "Fit sigma on a pilot of 20 tasks; re-run the sample size formula; check coverage by simulation on past runs."}, "security": ["Rows are aggregated and carry task ids only; no prompts or outputs.", "The random seed is stored so any third party can reproduce an interval."], "performance": {"slo": "Interval for 100 tasks x 3 repeats x 2 arms in under 5 s (DevX proposal).", "complexity": "O(B * N).", "scaling": "Vectorised; parallel across resamples."}, "edge_cases": ["A task has zero successes in one arm: CPS undefined for that arm, count as censored and report.", "Repeats differ between arms: use the minimum common repeats.", "Only 1 task pair: refuse an interval.", "All costs identical: interval collapses; flag as degenerate."], "tests": [{"name": "paired_ratio", "given": "arm A cost $10.00 for 20 successes, arm B $8.20 for 20", "expect": "ratio 0.82"}, {"name": "cluster", "given": "3 repeats of task T1", "expect": "all 3 rows resample together"}, {"name": "ni_pass", "given": "success delta -1.1 pp, bound -3 pp, lower 5th pct -2.4 pp", "expect": "ni_ok true"}, {"name": "ni_fail", "given": "lower 5th pct -4.0 pp, bound -3 pp", "expect": "ni_ok false, verdict revert"}, {"name": "sample_size", "given": "sigma 0.29, delta 10 percent", "expect": "n about 60 pairs"}, {"name": "seed", "given": "same rows and seed twice", "expect": "same interval"}], "cost_levers": ["Right-sized tests avoid paying for extra runs.", "Catches a fake win before rollout."], "feedback_events": ["Interval width vs plan.", "Coverage on back-tests."], "analytics_events": [{"name": "token_economics.stats.interval", "fields": ["run_id", "ratio", "lo", "hi", "n_tasks", "seed"], "when": "interval computed"}, {"name": "token_economics.stats.ni_check", "fields": ["run_id", "delta", "bound", "ok"], "when": "non-inferiority checked"}, {"name": "token_economics.stats.degenerate", "fields": ["run_id", "reason"], "when": "cannot compute"}], "papers": [{"ref": 116, "key_idea": "Preregistered paired task-clustered bootstrap with a success non-inferiority floor.", "how": "Core method."}, {"ref": 95, "key_idea": "Geometric SD x1.34 per task and arm; one probe plus 1.9x headroom.", "how": "Sigma input."}], "repos": [], "industry": "Bootstrap on task clusters is common in agent evaluation. Vendors rarely publish an interval or a bound.", "refs": [95, 128, 116, 99, 146, 110, 113, 114, 115]}}, "cpsc": {"label": "CPS calculator", "sub": "Cost per successful task, failures in", "kind": "eval", "stage": "evalroll", "group": "eval", "inn": "Ledger rows tagged with task id, success flag, attempt cost, caller and model.", "out": "cost per successful task (CPS) per task type, caller and model; failed-run waste share; spend after first repeated failure.", "store": "Reads the ledger and success flags. Writes CPS aggregates and waste reports.", "fail": "Fail open. A missing success flag leaves the attempt unscored and counted as unknown, never as a success.", "req": "RQ-D-023, RQ-D-024, RQ-D-025, RQ-D-026, RQ-D-027, RQ-D-028, RQ-D-034, RQ-D-046  Sources: A:122, A:069, C:026, C:024, C:028, C:027, C:023, C:025, C:053", "prop": "Dashboard layout and category list are DevX proposals. Metric definitions are sourced.", "hard": "Cost-driver conflict: input [C:023], output [C:027], or harness base 74.7 percent [C:024]. Output is 2.7 percent of tokens and 51.1 percent of dollars at 96.3 percent hit. Chosen: report all three buckets and let data decide. Failure-share baselines (32 and 51 percent) come from one 60-task study [C:028].", "line": "task_type=bugfix  attempts=3  ok=1  cost=$0.62\ncost per solve $0.62, failed spend 2/3", "dumb": "A cheap run that fails is not cheap. This counts the money for every try, including the failed ones, and divides by how many tasks truly got solved.", "deep": {"purpose": "Compute the headline metric. Cost per successful task counts all attempts including failures [A:122, C:026].", "expected": ["Sums cost over all attempts including failed ones, divided by successes.", "Reports per task category, since optimisations do not transfer across harnesses [C:024].", "Tracks failed-run waste share (baseline 32 percent) and spend after first repeated failure (baseline 51 percent) [C:028].", "Tracks quality guards: patch-apply, empty patch, format validity, fix-commit ratio [C:025, C:053]."], "not_expected": ["Never reports token savings alone.", "Never counts an unknown-outcome run as a success.", "No mixing of arms in one number."], "algorithm": {"name": "Failure-inclusive CPS", "formula": "CPS = sum_i cost_i / count(success_i)", "steps": ["Join ledger rows to task ids and the success flag.", "Group by category, caller, model, arm.", "Add the optimisation overhead (router call, summary call) to the task total [C:026].", "Compute CPS, waste share = failed cost / total cost, and cost after the first repeated failure signature.", "Publish with median and P95 per developer [C:054]."], "params": {"failed_run_waste_baseline": "32 percent [C:028]", "spend_after_repeat_failure_baseline": "51 percent [C:028]", "dispersion": "geometric SD x1.34 [C:027]", "harness_base_share": "74.7 percent of cost [C:024]", "early_stop_rule": "cut runs after the first repeated failure signature [C:028]"}}, "math": {"definitions": ["c_ij = billed cost of attempt j on task i, including overhead.", "s_i = number of successful attempts for task i (0 or 1 per task, repeats counted).", "S = sum of s_i over tasks.", "W = failed cost / total cost."], "formula_full": "CPS = (sum_i sum_j c_ij) / S;  W = (sum over failed attempts c_ij) / (sum_i sum_j c_ij)", "derivation": "Dividing total spend by successes charges every failed try to the tasks that did succeed. Token averages hide this because a cheap failure still adds to the numerator without raising S.", "worked_example": "Example inputs are illustrative. 10 tasks, total spend $5.00, 4 successes: CPS = 5.00 / 4 = $1.25. If failed attempts cost $1.60 of the $5.00, W = 0.32 (the same as the C:028 baseline). Say an optimisation cuts spend to $4.00 but successes drop to 3. Then CPS = 4.00 / 3 = $1.33, so cost per success rose.", "complexity": "O(N) over attempt rows.", "failure_modes": ["Success flag not verifiable: CPS undefined.", "Long tail of unfinished tasks removes costly failures from the denominator.", "Attempt rows missing overhead of the optimisation under test."], "calibration": "Reconcile the sum of attempt costs against the invoice for the same period. Compare W with the 32 percent baseline on the first 30 days."}, "security": ["Aggregates drop prompt text and keep ids and numbers only.", "Per-developer views follow tenant roles so one developer cannot read another cost profile without a grant."], "performance": {"slo": "Dashboard query under 2 s p95 for 30 days of data (DevX proposal).", "complexity": "Linear in rows; pre-aggregate daily.", "scaling": "Partition by tenant and day."}, "edge_cases": ["Task has several repeats: count each repeat as an attempt, each success separately.", "Success flag arrives late: restate the aggregate with a version tag.", "Zero successes in a category: CPS undefined, show spend only.", "Shared tool-call cost across two tasks: split by turn share."], "tests": [{"name": "cps_basic", "given": "spend $5.00, 4 successes", "expect": "CPS $1.25"}, {"name": "waste_share", "given": "failed attempts $1.60 of $5.00", "expect": "W 0.32"}, {"name": "no_success", "given": "spend $2.00, 0 successes", "expect": "CPS undefined, spend shown"}, {"name": "overhead", "given": "attempt $0.050 plus router $0.004", "expect": "task cost $0.054"}, {"name": "unknown_flag", "given": "attempt with no success flag", "expect": "counted unknown, n rves remove soft-cap overshoot."], "feedback_events": ["402 rate per tenant.", "503 rate.", "Mutation count by role."], "analytics_events": [{"name": "token_economics.api.request", "fields": ["route", "tenant", "status", "latency_ms"], "when": "each admin call"}, {"name": "token_economics.api.402", "fields": ["tenant", "key", "reserve", "remaining"], "when": "budget exhausted"}, {"name": "token_economics.api.503", "fields": ["tenant", "reason"], "when": "state unavailable"}], "papers": [], "repos": [{"ref": 2, "name": "Bifrost", "take": "HTTP 402 when a virtual-key budget is exhausted."}, {"ref": 3, "name": "LiteLLM", "take": "Virtual keys with max_budget and a duration."}], "industry": "Gateways expose budgets on virtual keys. Many allow soft overshoot [A:234].", "refs": [13, 4, 94, 2, 12]}}, "pol": {"label": "Policy-as-code store", "sub": "Versioned config, review before apply", "kind": "admin", "stage": "control", "group": "admin", "inn": "Policy bundle (budgets, allowed providers, caps, optimisation flags), signature, tenant id.", "out": "Resolved policy for a request: allow-list, caps, stages, kill state.", "store": "Reads the signed bundle. Writes bundle versions and decision logs (metadata).", "fail": "Fail closed. If no valid bundle exists, use a safe default: no dispatch to unlisted providers and no optimisation. Budgets keep their last good state.", "req": "RQ-D-059, RQ-D-060, RQ-D-061, RQ-D-062, RQ-D-050, RQ-D-051, RQ-D-056, RQ-D-065, RQ-D-041  Sources: C:001, A:193, C:104, A:234, C:074, A:010, A:019", "prop": "Bundle format, review flow and cold-start rules are DevX proposals. Route pinning with allowedProviders is sourced for Claude Code [C:104].", "hard": "Codex pins routes with model_provider in user config, so managed pinning is weaker there [C:104]. Chosen: the gateway is the enforcement point in all cases. Router labels must not rely on one dominant model [A:019]; strong-share ceiling [A:010] is a policy parameter.", "line": "bundle v42 signed; allowedProviders=[bedrock]\nstrong_share_cap=0.40; budget fail=closed", "dumb": "Rules as code: who may use which model, how much they may spend, which savings are on. A bundle must be signed and reviewed before it takes effect.", "deep": {"purpose": "Hold the policy-as-code that the gateway evaluates, and pin the route so the client cannot bypass Token Economics.", "expected": ["Loads only signed bundles and verifies the signature at the gateway.", "Pins the route with allowedProviders in managed settings (Claude Code) [C:104].", "Keeps enforcement at the gateway, never in a client hook [A:234, C:074].", "Applies a strong-share ceiling and refuses a router trained on one dominant model [A:010, A:019]."], "not_expected": ["No unsigned or unreviewed bundle in production.", "No policy that depends on a client hook for enforcement.", "No default that allows unlisted providers."], "algorithm": {"name": "Signed bundle evaluation", "formula": "decision = eval(bundle_vN, request) with default deny", "steps": ["Fetch the bundle for the tenant, verify the signature and version.", "Evaluate in order: provider allow-list, model price known, caps, budget, optimisation stage, kill state.", "Cache the decision for the session when the arm is pinned.", "If the bundle is invalid or missing, apply the cold-start default (deny unlisted, no optimisation).", "Log metadata only."], "params": {"default": "deny (DevX proposal)", "pin_claude_code": "allowedProviders in managed settings [C:104]", "pin_codex": "model_provider in user config [C:104]", "strong_share_ceiling": "policy parameter, see A:010", "review": "two-person approval (DevX proposal)"}}, "security": ["Bundles are signed; keys live in the vault; a failed signature check raises an alert.", "Policy evaluation has no network side effect and logs no prompt text."], "performance": {"slo": "Evaluation under 1 ms p99 with a cached bundle (DevX proposal).", "complexity": "Linear in rule count, small.", "scaling": "Bundles are cached per d writes tenant records, keys and budget counters.", "fail": "Fail closed for budgets: an unreadable budget counter blocks dispatch. Unpriced models are rejected, not defaulted.", "req": "RQ-D-063, RQ-D-064, RQ-D-065, RQ-D-066, RQ-D-055, RQ-D-056  Sources: C:060, C:061, C:001, A:242, A:245, A:191, A:010", "prop": "Key format, revocation latency and the budget period are DevX proposals. Virtual keys with budgets are sourced.", "hard": "Unpriced models and bring-your-own-key (BYOK) routes can escape budgets [A:242, A:245, A:191]. Chosen: reject any model with no price row, and bill BYOK usage in shadow accounting only. Hosted limits are not tenant budgets.", "line": "tenant=acme key=vk_9 max_budget=$500/30d\nmodel=x-new: no price row -> reject", "dumb": "Each customer gets their own keys and their own spending limit. A model without a known price is blocked, so nothing slips through unbilled.", "deep": {"purpose": "Isolate tenants and attach budgets to virtual keys (LiteLLM max_budget with a duration [C:060, C:061]; Bifrost 402 [C:001]).", "expected": ["Issues virtual keys with budget and duration.", "Returns 402 when a key budget is exhausted [C:001].", "Rejects unpriced models and unpriced BYOK routes [A:242, A:245].", "Revokes a key within the revocation service level objective (SLO)."], "not_expected": ["No shared budget counter across tenants.", "No dispatch to a model with no price row.", "No key text in logs."], "algorithm": {"name": "Virtual key budget", "formula": "spent + reserve <= max_budget within window", "steps": ["Resolve tenant from the key.", "Look up the price row of the requested model; reject if absent.", "Reserve the worst-case cost atomically against the key and tenant counters.", "On completion, settle with the billed cost and release the unused reserve.", "At window end, reset or roll over by policy."], "params": {"max_budget": "per key (LiteLLM max_budget [C:060])", "duration": "per key (LiteLLM budget_duration [C:061])", "exhausted_status": K escapes are known gaps [A:242, A:245].", "refs": [3, 93, 2, 89, 7, 94, 122]}}, "audit": {"label": "Audit log", "sub": "Every policy and budget change", "kind": "admin", "stage": "control", "group": "admin", "inn": "Events from api, pol, kill, secrets, authz and the data path: actor, action, scope, outcome.", "out": "Append-only metadata log with a hash chain and export.", "store": "Writes audit rows. Reads for export and verification.", "fail": "Fail closed for mutations. If an audit row cannot be written, the admin change is rejected. Fail open for data-path reads: a request is not blocked by a failed audit write, it is buffered.", "req": "RQ-D-067, RQ-D-068, RQ-D-057  Sources: A:217, C:104", "prop": "Hash chain, field list and export formats are DevX proposals. Metadata-only logging is sourced: content logging is opt-in in vendor telemetry [A:217, C:104].", "hard": "Retention period is not in corpus; see the ret card. Whether a hash chain is needed or object-lock storage is enough: open.", "line": "2026-11-09T10:02Z actor=ops-7 act=kill.set\nscope=acme/mask prev=9f2c.. hash=41ab..", "dumb": "A permanent record of who changed what and when. It has no prompts and no code, only facts about the actions.", "deep": {"purpose": "Record every control-plane action so changes can be traced. Log metadata only; content stays off unless a tenant opts in (OTEL_LOG_* style opt-in [A:217, C:104]).", "expected": ["Writes one row per admin mutation and per policy decision of class deny.", "Stores actor, action, scope, outcome, time, request id and diff of settings.", "Chains each row to the previous with a hash.", "Exports to the tenant store on a schedule."], "not_expected": ["No prompt or output text.", "No edit or delete of a row.", "No secrets in rows."], "algorithm": {"name": "Hash-chained append log", "formula": "hash_n = H(hash_{n-1} || canonical(row_n))", "steps": ["Build the row from the event with a fixed field set.", "Redact any field not on the allow-list.", "Compute s are common in security tooling.", "refs": [18, 14]}}, "secrets": {"label": "Secrets vault", "sub": "Provider keys, never in config", "kind": "admin", "stage": "control", "group": "sec", "inn": "Provider keys, OAuth tokens, signing keys, per-tenant secret references.", "out": "Short-lived credentials handed to the gateway at call time.", "store": "Reads and writes encrypted secrets in the vault. Writes access audit rows.", "fail": "Fail closed. If a secret cannot be fetched, the call is rejected with 503 and no request goes out with a wrong key.", "req": "RQ-D-069, RQ-D-070, RQ-D-071  Sources: C:104, A:193, C:088", "prop": "Whole card is a DevX proposal except the point that credentials differ by harness (OAuth and key modes) [A:193, C:088].", "hard": "How subscription (OAuth) credentials are handled by a gateway is not settled in the corpus. Chosen: do not store end-user subscription tokens; accept only API keys and cloud-role credentials.", "line": "tenant=acme provider=bedrock ref=vault://acme/br\nissued 15-min token; never logged", "dumb": "A safe for the keys that let Token Economics talk to model providers. Keys are only handed out briefly and are never written to logs.", "deep": {"purpose": "Store and deliver provider credentials with the least exposure.", "expected": ["Encrypts secrets at rest and per tenant.", "Issues short-lived tokens where the provider supports it.", "Logs each access as a metadata audit row.", "Blocks a secret from appearing in any log, trace or error."], "not_expected": ["No secret in config files, env dumps or logs.", "No sharing of a secret across tenants.", "No storage of end-user subscription tokens."], "algorithm": {"name": "Per-tenant vault fetch", "formula": "token = vault.fetch(tenant, ref, ttl)", "steps": ["Gateway requests a secret by tenant and reference.", "Vault checks the caller identity and tenant scope.", "Vault returns a token with a time to live, or a wrapped key.", "Gateway caches it in memory for the ttl and zeroes n store provider keys in config; Token Economics does not.", "refs": [14, 0, 1]}}, "authz": {"label": "Admin authorisation", "sub": "Roles, scoped tokens", "kind": "admin", "stage": "control", "group": "sec", "inn": "Actor identity, role, requested operation, scope (tenant, optimisation).", "out": "Allow or deny with the matched rule.", "store": "Reads role bindings. Writes decision rows (deny) to the audit log.", "fail": "Fail closed. If role data is unreadable, deny admin actions. Data-path calls use the cached key scope.", "req": "RQ-D-072, RQ-D-073  Sources: C:088", "prop": "Whole card is a DevX proposal. Only the point that harnesses differ in credential and permission models has a source [C:088].", "hard": "Role set is a proposal and needs review with the first customer. Whether to use external identity providers is open.", "line": "actor=ops-7 role=rollout op=kill.set scope=acme\n-> allow (rule r12)", "dumb": "Decides who may press which button. A developer can read their own spend, an operator can stop a saving, and an admin can change budgets.", "deep": {"purpose": "Give each admin action the least role that can do it, so kill and policy changes are controlled.", "expected": ["Defines roles: viewer, developer, rollout, finance, admin.", "Allows kill only to rollout and admin.", "Checks scope on every call; tenant roles do not cross tenants.", "Audits every deny."], "not_expected": ["No wildcard role in production.", "No role inherited across tenants.", "No permission through a client hook."], "algorithm": {"name": "Role-scope check", "formula": "allow iff exists binding(actor, role, scope) and op in perms(role)", "steps": ["Resolve the actor from the token.", "Load bindings for the tenant scope.", "Check the operation against the role permission table.", "Return allow or deny with the rule id.", "Write a deny audit row."], "params": {"roles": "viewer, developer, rollout, finance, admin (DevX proposal)", "kill_roles": "rollout, admin (DevX proposal)", "cache del and effort level in Claude Code", "url": "https://www.claude.com/blog/claude-model-and-effort-level-in-claude-code", "topic": "CLI-agent research"}, {"cite": "A:104 The Benefits of a Concise Chain of Thought on Problem-Solving in Large Language Models", "url": "https://arxiv.org/abs/2401.05618", "topic": "API-side research"}, {"cite": "C:077 How Claude remembers your project", "url": "https://code.claude.com/docs/en/memory", "topic": "CLI-agent research"}, {"cite": "A:269 The components of agent memory", "url": "https://www.anthropic.com/research/components-of-agent-memory", "topic": "API-side research"}, {"cite": "C:075 Extend Claude with skills", "url": "https://code.claude.com/docs/en/skills", "topic": "CLI-agent research"}, {"cite": "C:079 Explore the context window", "url": "https://code.claude.com/docs/en/context-window", "topic": "CLI-agent research"}, {"cite": "A:207 The builder's guide to GPT-5.6", "url": "https://openai.com/index/builders-guide-to-gpt-5-6", "topic": "API-side research"}, {"cite": "C:053 Inference Economics of Enterprise Coding Agents: A Case Study of Cloud vs. On-Premise LLMs", "url": "https://arxiv.org/abs/2607.13080", "topic": "CLI-agent research"}, {"cite": "A:122 Cost-of-Pass: An Economic Framework for Evaluating Language Models", "url": "https://arxiv.org/abs/2504.13359", "topic": "API-side research"}, {"cite": "C:081 Orchestrate teams of Claude Code sessions", "url": "https://code.claude.com/docs/en/agent-teams", "topic": "CLI-agent research"}, {"cite": "A:060 Claw-SWE-Bench: A Benchmark for Evaluating OpenClaw-style Agent Harnesses on Coding Tasks", "url": "https://arxiv.org/abs/2606.12344", "topic": "API-side research"}, {"cite": "C:063 A Survey of Small Language Models: Architectures, Capabilities, and Deployment Trade-offs", "url": "https://arxiv.org/abs/2510.03847", "topic": "CLI-agent research"}, {"cite": "A:241 AI Gateway (Portkey)", "url": "https://portkey.ai/docs/product/ai-gateway", "topic": "API-side research"}, {"cite": "A:243 Optimizing LLM costs: operational best practices (Portkey)", "url": "https://docs.portkey.ai/docs/guides/whitepapers/optimizing-llm-costs/operational-best-practices", "topic": "API-side research"}]};
const NW=170, NH=64, CP=420, RP=210, M=150, T=70;
const S = Object.fromEntries(D.stages.map(s=>[s.id,s]));
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);

function crumbs(parts){
  $('crumbs').innerHTML = parts.map((p,i)=> p.href ? `<a href="${p.href}">${esc(p.t)}</a>` : `<b>${esc(p.t)}</b>`).join(' <span>›</span> ');
}
function chipsFor(stage){
  const count={};
  stage.nodes.filter(n=>!n.ghost).forEach(n=>{const k=D.comps[n.base].kind;count[k]=(count[k]||0)+1});
  return Object.entries(count).map(([k,v])=>{const K=D.kinds[k];return `<span class="chip" style="background:${K.fill};border-color:${K.stroke}">${v} ${esc(K.name)}</span>`}).join('');
}

/* ---------- Level 1 ---------- */
function overview(){
  crumbs([{t:'Overview'}]);
  $('title').innerHTML = '<span class="lvl">Level 1</span>One request, from harness to backend and back to the ledger';
  const main = D.stages.filter(s=>s.role==='main'), sup = D.stages.filter(s=>s.role==='support');
  const card = s => `<div class="scard ${s.role==='support'?'sup':''}" data-go="#/s/${s.id}"><span class="num">${esc(s.n)}</span><h3>${esc(s.title)}</h3><p>${esc(s.blurb)}</p><div class="chips">${chipsFor(s)}</div><div class="go">Open stage (${s.groups.length} groups, ${s.nodes.filter(n=>!n.ghost).length} components) →</div></div>`;
  $('main').innerHTML = `<p class="sub">Token Economics sits between harnesses and backends. The gateway is the source of truth; hooks and telemetry only add detail. Pick a stage to go one level down.</p>
  <div class="flow">${main.map(card).join('<span class="arrow">→</span>')}</div>
  <h2>Supporting stages</h2>
  <div class="flow">${sup.map(card).join('')}</div>
  <h2>Cross-cutting design</h2>
  <div class="flow">${(D.xc||[]).map(x=>`<div class="scard sup" data-go="#/x/${x.id}"><h3>${esc(x.title)}</h3><p>${esc(x.blurb)}</p><div class="go">Open →</div></div>`).join('')}<div class="scard sup" data-go="#/x/refs"><h3>Research and references</h3><p>${D.refs.length} sources behind the cards.</p><div class="go">Open →</div></div></div>
  <p class="hint">Level 2 shows one stage as a few groups. Level 3 shows one group with its components and the arrows between them. Level 4 is a spec card for one component. Total: ${Object.keys(D.comps).length} components.</p>`;
  document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>location.hash=e.dataset.go);
}

/* ---------- Level 2 ---------- */
function wrap(text,max){
  const words=text.split(/\s+/), lines=[]; let cur='';
  words.forEach(w=>{ if((cur+' '+w).trim().length>max){ if(cur) lines.push(cur); cur=w } else cur=(cur+' '+w).trim() });
  if(cur) lines.push(cur); return lines;
}
function clip(s,n){return s.length>n?s.slice(0,n-1)+'…':s}

function graphView(st,head){
  crumbs(head.crumbs);
  $('title').innerHTML = head.title;
  const byId=Object.fromEntries(st.nodes.map(n=>[n.id,n]));
  /* Level 3: a gap between columns grows by 30px for every line beyond 5 that crosses it */
  const mc0=Math.max(...st.nodes.map(n=>n.c)), colX=[M]; 
  for(let c=0;c<mc0;c++){let x=0; if(st.route) st.edges.forEach(e=>{const A=byId[e.a],B=byId[e.b]; if(A&&B&&Math.min(A.c,B.c)<=c&&Math.max(A.c,B.c)>c) x++}); colX.push(colX[c]+CP+(st.route?Math.max(0,x-5)*30:0))}
  const cxOf=c=>colX[Math.floor(c)]+(c-Math.floor(c))*CP;
  const P = n => ({cx:cxOf(n.c), cy:T+n.r*RP});
  const side=(n,s)=>{const p=P(n);return s==='left'?[p.cx-NW/2,p.cy]:s==='right'?[p.cx+NW/2,p.cy]:s==='top'?[p.cx,p.cy-NH/2]:[p.cx,p.cy+NH/2]};

/* ---------- Level 3: components of one group ---------- */
const GL={};
const ER=s=>s.edges.map(e=>Object.assign({},e,{a:e.ra||e.a,b:e.rb||e.b}));
D.stages.forEach(s=>s.nodes.forEach(n=>{if(n.ghost){const t=D.stages.find(z=>z.id===n.gk[0]);GL[n.id]=t.groups.find(q=>q.id===n.gk[1]).title+' (group)'}}));
function groupView(sid,gid){
  const st=S[sid], g=st&&st.groups.find(z=>z.id===gid); if(!g){location.hash='#/';return}
  const mem=new Set(g.members), edges=[], seen=new Set(), ghosts=new Set();
  D.stages.forEach(s=>ER(s).forEach(e=>{
    const a=baseOf(e.a), b=baseOf(e.b), ia=mem.has(a), ib=mem.has(b); if(!ia&&!ib) return;
    const key=(ia?a:groupOf(a))+'>'+(ib?b:groupOf(b))+'>'+(e.l||''); if(seen.has(key)) return; seen.add(key);
    const gk=x=>'g:'+groupOf(x)+'*', na=ia?a:gk(a), nb=ib?b:gk(b); if(!ia) ghosts.add(gk(a)); if(!ib) ghosts.add(gk(b));
    edges.push({a:na,b:nb,l:e.l,k:e.k,bi:e.bi,d:e.d});
  }));
  /* order members left to right, treating a hop through an outside group as a link between the two members it joins */
  const isG=x=>x.endsWith('*'), nb=new Map();
  edges.forEach(e=>{if(isG(e.a)&&mem.has(e.b)) (nb.get(e.a)||nb.set(e.a,{i:[],o:[]}).get(e.a)).o.push(e.b); if(isG(e.b)&&mem.has(e.a)) (nb.get(e.b)||nb.set(e.b,{i:[],o:[]}).get(e.b)).i.push(e.a)});
  const direct=edges.filter(e=>mem.has(e.a)&&mem.has(e.b)).map(e=>[e.a,e.b]);
  const hops=x=>{const v=nb.get(x), r=[]; v.i.forEach(a=>v.o.forEach(b=>{if(a!==b) r.push([a,b])})); return r};
  const relax=(ids,links,dep)=>{ids.forEach(m=>dep[m]=0); for(let it=0;it<ids.length;it++) links.forEach(([a,b])=>{if(dep[a]+1>dep[b]&&dep[a]+1<ids.length) dep[b]=dep[a]+1}); return dep};
  const l0=[...direct]; nb.forEach((v,x)=>l0.push(...hops(x)));
  const depth0=relax(g.members,l0,{});
  /* an outside group that both receives from and feeds members becomes a real box in the chain: lower-column neighbours feed it, higher ones are fed by it */
  const midG=[...nb.keys()].filter(x=>nb.get(x).i.length&&nb.get(x).o.length), anchor={};
  const l1=[...direct]; nb.forEach((v,x)=>{if(!midG.includes(x)) l1.push(...hops(x))});
  midG.forEach(x=>{const v=nb.get(x), nm=[...new Set([...v.i,...v.o])], mn=Math.min(...nm.map(m=>depth0[m])); anchor[x]=nm.find(m=>depth0[m]===mn);
    nm.forEach(m=>l1.push(depth0[m]===mn?[m,x]:[x,m]))});
  const depth=relax([...g.members,...midG],l1,{});
  /* a group that only feeds members sits one column before its first target; one that only receives sits after its last source */
  const ghostCol={}, ghostMode={};
  nb.forEach((v,x)=>{const ins=v.o.map(m=>depth[m]), outs=v.i.map(m=>depth[m]);
    if(v.i.length&&v.o.length){ghostMode[x]='mid'; const nm=new Set([...v.i,...v.o]); ghostCol[x]=nm.size===1?depth[[...nm][0]]+1:depth[x]}
    else if(v.o.length){ghostMode[x]='src'; ghostCol[x]=Math.min(...ins)-1}
    else {ghostMode[x]='dst'; ghostCol[x]=Math.max(...outs)+1}});
  const minC=Math.min(0,...Object.values(ghostCol)), off=-minC;
  const used={}, take=(c,pref)=>{used[c]=used[c]||new Set(); let r=pref; const clash=r=>Object.keys(used).some(k=>Math.abs(k-c)<1&&used[k].has(r)); while(used[c].has(r)||clash(r)) r++; used[c].add(r); return r};
  const nodes=[], rowOf={};
  [...g.members].sort((x,y)=>depth[x]-depth[y]).forEach(m=>{const c=depth[m]+off; const r=take(c,0); rowOf[m]=r; nodes.push({id:m,base:m,c,r})});
  const gnode=(x,c,r)=>{const [gs,gg]=x.slice(2,-1).split('/'); GL[x]=S[gs].groups.find(q=>q.id===gg).title+' (group)'; nodes.push({id:x,gk:[gs,gg],ghost:true,c,r})};
  const mainRows=Math.max(...Object.values(rowOf))+1;
  [...nb.keys()].forEach(x=>{const c=ghostCol[x]+off, v=nb.get(x);
    if(ghostMode[x]==='mid'){gnode(x,c,take(c,rowOf[anchor[x]]))}
    else {const t=(ghostMode[x]==='src'?v.o:v.i)[0]; gnode(x,c,take(c,rowOf[t]+(used[c]&&used[c].has(rowOf[t])?1:0)))}});
  /* a pair of opposite lines between the same two boxes becomes one two-way line; both texts stay in its hover and list entry */
  for(let i=0;i<edges.length;i++){const e=edges[i]; if(e.bi) continue;
    const j=edges.findIndex((f,k)=>k>i&&!f.bi&&f.a===e.b&&f.b===e.a);
    if(j<0) continue; const f=edges[j];
    e.d=(e.l?e.l+': ':'')+(e.d||'')+'  |  back: '+(f.l?f.l+': ':'')+(f.d||''); e.l=[e.l,f.l].filter(Boolean).join(' / ');
    e.k=e.k==='e'||f.k==='e'?'e':e.k; e.bi=true; edges.splice(j,1)}
  /* several lines between the same two boxes in the same direction become one line; every text stays in its hover and list entry */
  for(let i=0;i<edges.length;i++){const e=edges[i];
    for(let j=edges.length-1;j>i;j--){const f=edges[j]; if(f.a!==e.a||f.b!==e.b||!!f.bi!==!!e.bi) continue;
      e.d=(e.l?e.l+': ':'')+(e.d||'')+'  +  '+(f.l?f.l+': ':'')+(f.d||''); e.l=[e.l,f.l].filter(Boolean).join(' + ');

  const colOf=Object.fromEntries(nodes.map(n=>[n.id,n.c])), rw=Object.fromEntries(nodes.map(n=>[n.id,n.r]));

  const ps={n:st.n,title:g.title,blurb:g.line,nodes,edges,frames:[],route:true};
  const gi=st.groups.findIndex(z=>z.id===gid), pg=st.groups[gi-1], ng=st.groups[gi+1];
  graphView(ps,{crumbs:[{t:'Overview',href:'#/'},{t:st.n+'. '+st.title,href:'#/s/'+sid},{t:g.title}],
    title:`<span class="lvl">Level 3</span>${esc(g.title)} <small style="font-weight:400;color:var(--mut)">in ${esc(st.title)}</small>`,
    sub:g.line.replace(/\n/g,' '),
    nav:`<a href="#/s/${sid}">← All groups in ${esc(st.title)}</a>${pg?` &nbsp; <a href="#/g/${sid}/${pg.id}">← ${esc(pg.title)}</a>`:''}${ng?` &nbsp; <a href="#/g/${sid}/${ng.id}">${esc(ng.title)} →</a>`:''}`});
}
function hover(el,html){

  crumbs([{t:'Overview',href:'#/'},{t:x.title}]);
  $('title').innerHTML=`<span class="lvl">Cross-cutting</span>${esc(x.title)}`;
  $('main').innerHTML=`<p class="sub">${esc(x.intro)}</p><div class="card deep">${x.sections.map(s=>`<div class="sec"><h3>${esc(s.h)}</h3>${s.p?`<p>${esc(s.p)}</p>`:''}${s.kind==='table'?`<div style="overflow:auto"><table class="xtab"><tr>${s.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${s.rows.map(r=>`<tr>${r.map(c=>`<td>${Array.isArray(c)?c.map(f=>`<span class="pill">${esc(f)}</span>`).join(''):esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`:ul(s.rows)}</div>`).join('')}</div>`;
}
function ul(a){return `<ul>${(a||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}

function route(){
  $('tip').style.display='none';
  const h=location.hash.replace(/^#\/?/,'').split('/');
  window.scrollTo(0,0);
  if(h[0]==='s') stageView(h[1]); else if(h[0]==='g') groupView(h[1],h[2]); else if(h[0]==='c') cardView(h[1]); else if(h[0]==='x') xView(h[1]); else overview();
}
addEventListener('hashchange',route);
addEventListener('keydown',e=>{ if(e.key==='Escape'){ const h=location.hash.split('/'); if(h[1]==='c'){const q=D.comps[h[2]]; location.hash='#/g/'+q.stage+'/'+q.group} else if(h[1]==='g') location.hash='#/s/'+h[2]; else if(h[1]==='s') location.hash='#/'; }});
route();
</script>
</body>
</html>
